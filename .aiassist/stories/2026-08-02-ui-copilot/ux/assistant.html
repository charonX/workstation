<!-- @dsCard group="助手" name="会话中心" viewport="desktop" -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>助手 — 会话中心原型</title>
<link rel="stylesheet" href="_ds/global/tokens.css">
<link rel="stylesheet" href="_ds/global/styles.css">
<style>
  /* 会话中心骨架：全部落在设计系统 token 上。
     双栏布局（左栏会话列表 + 右栏对话窗）为本原型新增组件族（候选入全局组件库）。 */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ch-bg);
    color: var(--ch-text);
    font-family: var(--ch-font-sans);
    font-size: var(--ch-text-base);
    line-height: var(--ch-leading-normal);
  }
  .app { display: flex; height: 100vh; overflow: hidden; }

  /* —— 左栏：会话列表 —— */
  .sidebar {
    width: 264px; flex-shrink: 0;
    display: flex; flex-direction: column;
    background: var(--ch-surface);
    border-right: 1px solid var(--ch-border);
  }
  .sidebar-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--ch-space-4) var(--ch-space-4) var(--ch-space-3);
  }
  .sidebar-title { font-size: var(--ch-text-lg); font-weight: var(--ch-weight-semibold); margin: 0; }
  .session-nav { flex: 1; overflow-y: auto; padding: 0 var(--ch-space-2) var(--ch-space-3); }

  .nav-group { margin-top: var(--ch-space-3); }
  .nav-group-label {
    padding: var(--ch-space-1) var(--ch-space-2);
    font-size: var(--ch-text-xs);
    color: var(--ch-text-tertiary);
    font-weight: var(--ch-weight-medium);
  }
  .nav-project {
    display: flex; align-items: center; gap: var(--ch-space-2);
    width: 100%;
    padding: var(--ch-space-2) var(--ch-space-2);
    background: none; border: none; cursor: pointer;
    font-family: var(--ch-font-sans); font-size: var(--ch-text-base);
    color: var(--ch-text); text-align: left;
    border-radius: var(--ch-radius-md);
  }
  .nav-project:hover { background: var(--ch-surface-high); }
  .nav-project .chev { color: var(--ch-text-tertiary); font-size: var(--ch-text-xs); width: 12px; }
  .nav-project .proj-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-project.deleted .proj-name { color: var(--ch-text-tertiary); text-decoration: line-through; }
  /* 项目行内新建会话（2026-08-06 拍板：解决"无会话项目无法首发"缺口；
     悬停显现；已删除项目无此按钮；飞书分组无） */
  .nav-project .add-btn {
    flex-shrink: 0;
    width: 20px; height: 20px; line-height: 18px;
    text-align: center;
    border-radius: var(--ch-radius-md);
    color: var(--ch-text-tertiary);
    font-size: var(--ch-text-md);
    opacity: 0;
    transition: opacity 0.12s ease;
  }
  .nav-project:hover .add-btn, .nav-project .add-btn:focus-visible { opacity: 1; }
  .nav-project .add-btn:hover { background: var(--ch-accent-soft); color: var(--ch-accent); }

  .session-item {
    display: block; width: 100%;
    padding: var(--ch-space-2) var(--ch-space-2) var(--ch-space-2) var(--ch-space-5);
    background: none; border: none; cursor: pointer;
    font-family: var(--ch-font-sans); text-align: left;
    border-radius: var(--ch-radius-md);
    color: var(--ch-text-secondary);
  }
  .session-item:hover { background: var(--ch-surface-high); }
  .session-item.active { background: var(--ch-accent-soft); color: var(--ch-text); }
  .session-item .s-title {
    display: block; font-size: var(--ch-text-base);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .session-item .s-meta { display: block; font-size: var(--ch-text-xs); color: var(--ch-text-tertiary); margin-top: 1px; }
  .session-item.readonly .s-title::after { content: " · 只读"; color: var(--ch-text-tertiary); font-size: var(--ch-text-xs); }
  .nav-empty { padding: var(--ch-space-1) var(--ch-space-2) var(--ch-space-1) var(--ch-space-5); font-size: var(--ch-text-sm); color: var(--ch-text-tertiary); }

  .sidebar-settings {
    border-top: 1px solid var(--ch-border);
    padding: var(--ch-space-2);
  }
  .nav-page {
    display: block; width: 100%;
    padding: var(--ch-space-2) var(--ch-space-2);
    background: none; border: none; cursor: pointer;
    font-family: var(--ch-font-sans); font-size: var(--ch-text-base);
    color: var(--ch-text-secondary); text-align: left;
    border-radius: var(--ch-radius-md);
  }
  .nav-page:hover { background: var(--ch-surface-high); }
  .nav-page.active { background: var(--ch-accent-soft); color: var(--ch-text); }

  /* 管理页面右栏原位呈现（原型占位，实际为既有页面路由） */
  .page-view { flex: 1; overflow-y: auto; padding: var(--ch-space-5) var(--ch-space-6); }
  .page-view h2 { font-size: var(--ch-text-xl); font-weight: var(--ch-weight-semibold); margin: 0 0 var(--ch-space-2); }
  .page-view .pv-note { color: var(--ch-text-tertiary); font-size: var(--ch-text-sm); margin: 0 0 var(--ch-space-5); }
  .stat-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--ch-space-3); max-width: 760px; }
  .stat-card { border: 1px solid var(--ch-border); background: var(--ch-surface); border-radius: var(--ch-radius-xl); padding: var(--ch-space-4); }
  .stat-card .sc-value { font-size: var(--ch-text-2xl); font-weight: var(--ch-weight-semibold); }
  .stat-card .sc-label { font-size: var(--ch-text-xs); color: var(--ch-text-secondary); margin-top: var(--ch-space-1); }

  .sidebar-footer {
    border-top: 1px solid var(--ch-border);
    padding: var(--ch-space-3);
    font-size: var(--ch-text-xs); color: var(--ch-text-tertiary);
  }
  .sidebar-footer .proto-label { margin-bottom: var(--ch-space-2); }
  .proto-links { display: flex; gap: var(--ch-space-2); flex-wrap: wrap; }
  .proto-links button {
    background: none; border: 1px solid var(--ch-border); border-radius: var(--ch-radius-full);
    padding: 2px 10px; font-size: var(--ch-text-xs); color: var(--ch-text-secondary); cursor: pointer;
    font-family: var(--ch-font-sans);
  }
  .proto-links button:hover { border-color: var(--ch-accent); color: var(--ch-accent); }

  /* —— 右栏：对话窗 —— */
  .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-header {
    display: flex; align-items: center; gap: var(--ch-space-3);
    padding: var(--ch-space-3) var(--ch-space-5);
    border-bottom: 1px solid var(--ch-border);
    background: var(--ch-surface);
  }
  .chat-title { font-size: var(--ch-text-md); font-weight: var(--ch-weight-semibold); margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .status-badge {
    display: inline-flex; align-items: center; gap: var(--ch-space-2);
    padding: 2px 10px;
    border-radius: var(--ch-radius-full);
    font-size: var(--ch-text-xs);
    font-weight: var(--ch-weight-medium);
    flex-shrink: 0;
  }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; }
  .badge-space { background: var(--ch-accent-soft); color: var(--ch-accent); }
  .badge-muted { background: var(--ch-surface-high); color: var(--ch-text-secondary); }

  .messages { flex: 1; overflow-y: auto; padding: var(--ch-space-5); }
  .msg { display: flex; margin-bottom: var(--ch-space-4); }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 72%;
    padding: var(--ch-space-3) var(--ch-space-4);
    border-radius: var(--ch-radius-xl);
    font-size: var(--ch-text-base);
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: var(--ch-accent); color: var(--ch-accent-text); border-bottom-right-radius: var(--ch-radius-sm); }
  .msg.agent .bubble { background: var(--ch-surface); border: 1px solid var(--ch-border); border-bottom-left-radius: var(--ch-radius-sm); }
  .msg.agent .bubble.streaming::after {
    content: "▍"; color: var(--ch-accent);
    animation: blink 0.9s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .bubble .b-time { display: block; margin-top: var(--ch-space-2); font-size: var(--ch-text-xs); opacity: 0.65; }

  /* 工具调用行（M2 能力预览：读文件/跑脚本在对话里可见） */
  .tool-row {
    display: flex; align-items: center; gap: var(--ch-space-2);
    margin: var(--ch-space-2) 0;
    padding: var(--ch-space-2) var(--ch-space-3);
    background: var(--ch-surface-high);
    border-radius: var(--ch-radius-md);
    font-size: var(--ch-text-sm); color: var(--ch-text-secondary);
  }
  .tool-row .tool-tag {
    font-size: var(--ch-text-xs); font-weight: var(--ch-weight-semibold);
    color: var(--ch-accent); background: var(--ch-accent-soft);
    padding: 1px 8px; border-radius: var(--ch-radius-full);
  }
  .tool-row code { font-family: var(--ch-font-mono); font-size: var(--ch-text-xs); }

  /* 内联高危确认卡 */
  .confirm-card {
    max-width: 72%;
    border: 1px solid var(--ch-warning);
    background: var(--ch-warning-soft);
    border-radius: var(--ch-radius-xl);
    padding: var(--ch-space-4);
    margin-bottom: var(--ch-space-4);
  }
  .confirm-card.done { border-color: var(--ch-border); background: var(--ch-surface); opacity: 0.75; }
  .confirm-title { display: flex; align-items: center; gap: var(--ch-space-2); font-weight: var(--ch-weight-semibold); font-size: var(--ch-text-base); margin: 0 0 var(--ch-space-2); }
  .confirm-title .warn-badge { background: var(--ch-warning); color: #fff; font-size: var(--ch-text-xs); padding: 1px 8px; border-radius: var(--ch-radius-full); }
  .confirm-desc { font-size: var(--ch-text-sm); color: var(--ch-text-secondary); margin: 0 0 var(--ch-space-3); }
  .confirm-desc code { font-family: var(--ch-font-mono); font-size: var(--ch-text-xs); background: var(--ch-surface-high); padding: 1px 5px; border-radius: var(--ch-radius-sm); }
  .confirm-actions { display: flex; gap: var(--ch-space-3); align-items: center; }
  .confirm-result { font-size: var(--ch-text-xs); color: var(--ch-text-tertiary); }

  .btn {
    display: inline-flex; align-items: center; gap: var(--ch-space-2);
    padding: 6px 14px;
    border-radius: var(--ch-radius-md);
    font-weight: var(--ch-weight-semibold);
    font-size: var(--ch-text-sm);
    cursor: pointer;
    border: 1px solid transparent;
    font-family: var(--ch-font-sans);
    transition: opacity 0.15s ease;
  }
  .btn:hover { opacity: 0.88; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { background: var(--ch-accent); color: var(--ch-accent-text); }
  .btn-secondary { background: transparent; border-color: var(--ch-border); color: var(--ch-text); }
  .btn-danger { background: var(--ch-error); color: #fff; }

  /* 执行结果小表（agent 回复内嵌） */
  .result-list { margin: var(--ch-space-2) 0 0; padding: 0; list-style: none; }
  .result-list li {
    display: flex; align-items: center; gap: var(--ch-space-2);
    padding: var(--ch-space-2) 0;
    border-bottom: 1px solid var(--ch-border);
    font-size: var(--ch-text-sm);
  }
  .result-list li:last-child { border-bottom: none; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot.ok { background: var(--ch-success); }
  .dot.err { background: var(--ch-error); }
  .dot.run { background: var(--ch-warning); }

  /* 输入区 */
  .composer { border-top: 1px solid var(--ch-border); background: var(--ch-surface); padding: var(--ch-space-3) var(--ch-space-5); }
  .composer-chips { display: flex; gap: var(--ch-space-2); margin-bottom: var(--ch-space-2); }
  .ctx-chip {
    display: inline-flex; align-items: center; gap: var(--ch-space-1);
    font-size: var(--ch-text-xs); color: var(--ch-text-secondary);
    background: var(--ch-surface-high); border: 1px solid var(--ch-border);
    padding: 2px 10px; border-radius: var(--ch-radius-full);
  }
  .composer-row { display: flex; gap: var(--ch-space-3); align-items: flex-end; }
  .composer-input {
    flex: 1; min-height: 40px; max-height: 120px;
    padding: var(--ch-space-2) var(--ch-space-3);
    border: 1px solid var(--ch-border); border-radius: var(--ch-radius-lg);
    background: var(--ch-bg); color: var(--ch-text);
    font-family: var(--ch-font-sans); font-size: var(--ch-text-base);
    resize: none; outline: none;
  }
  .composer-input:focus { border-color: var(--ch-accent); }
  .composer-disabled {
    display: flex; align-items: center; justify-content: center; gap: var(--ch-space-2);
    padding: var(--ch-space-3);
    color: var(--ch-text-tertiary); font-size: var(--ch-text-sm);
    background: var(--ch-surface-high); border-radius: var(--ch-radius-lg);
  }

  /* 空态 / 引导态 */
  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--ch-space-6); text-align: center; }
  .empty-title { font-size: var(--ch-text-2xl); font-weight: var(--ch-weight-semibold); margin: 0 0 var(--ch-space-2); }
  .empty-title .space-name { color: var(--ch-accent); }
  .empty-sub { color: var(--ch-text-secondary); margin: 0 0 var(--ch-space-6); }

  .guide-card {
    border: 1px solid var(--ch-border); background: var(--ch-surface);
    border-radius: var(--ch-radius-xl); padding: var(--ch-space-6);
    max-width: 420px; text-align: center;
  }
  .guide-card p { color: var(--ch-text-secondary); margin: var(--ch-space-2) 0 var(--ch-space-4); }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<!-- ========== 会话区（默认落地页） ========== -->
<div class="app" id="screen-chat">

  <!-- ========== 左栏：会话列表（S1/S4） ========== -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1 class="sidebar-title">助手</h1>
      <!-- 新对话归属 = 当前选中分组（业务规则 7.1） -->
      <button class="btn btn-primary" id="new-chat-btn">新对话</button>
    </div>

    <nav class="session-nav" id="session-nav" aria-label="会话列表">
      <!-- 通用分组（ui:copilot） -->
      <div class="nav-group">
        <div class="nav-group-label">通用</div>
        <button class="session-item active" data-session="g1">
          <span class="s-title">看看最近的执行情况</span>
          <span class="s-meta">14:32</span>
        </button>
        <button class="session-item" data-session="g2">
          <span class="s-title">跑一下日报流程</span>
          <span class="s-meta">昨天</span>
        </button>
      </div>

      <!-- 项目分组（ui:project:<id>，项目下嵌套会话） -->
      <div class="nav-group">
        <div class="nav-group-label">项目</div>

        <div class="nav-project" data-project="knowledge" aria-expanded="true">
          <span class="chev">▾</span><span class="proj-name">knowledge</span><span class="add-btn" data-add-project="knowledge" title="在 knowledge 新建会话" role="button" aria-label="在 knowledge 新建会话">＋</span></div>
        <div data-project-sessions="knowledge">
          <button class="session-item" data-session="p1">
            <span class="s-title">总结一下 README 和最近改动</span>
            <span class="s-meta">13:58</span>
          </button>
          <button class="session-item" data-session="p2">
            <span class="s-title">把 vendor 的同步脚本跑通</span>
            <span class="s-meta">周一</span>
          </button>
        </div>

        <div class="nav-project" data-project="workstation" aria-expanded="false">
          <span class="chev">▸</span><span class="proj-name">workstation</span><span class="add-btn" data-add-project="workstation" title="在 workstation 新建会话" role="button" aria-label="在 workstation 新建会话">＋</span></div>
        <div data-project-sessions="workstation" hidden>
          <button class="session-item" data-session="p3">
            <span class="s-title">昨晚定时任务为什么失败</span>
            <span class="s-meta">周日</span>
          </button>
        </div>

        <div class="nav-project" data-project="banshan" aria-expanded="false">
          <span class="chev">▸</span><span class="proj-name">BanshanJourney</span><span class="add-btn" data-add-project="banshan" title="在 BanshanJourney 新建会话" role="button" aria-label="在 BanshanJourney 新建会话">＋</span></div>
        <div data-project-sessions="banshan" hidden>
          <div class="nav-empty">没有聊天</div>
        </div>

        <!-- 孤儿会话：项目已删除，仅可回看（业务规则 7.1） -->
        <div class="nav-project deleted" data-project="oldblog" aria-expanded="false">
          <span class="chev">▸</span><span class="proj-name">old-blog</span>
        </div>
        <div data-project-sessions="oldblog" hidden>
          <button class="session-item" data-session="orphan">
            <span class="s-title">日报模板再改一版</span>
            <span class="s-meta">项目已删除</span>
          </button>
        </div>
      </div>

      <!-- 飞书分组（M2 拍板 2026-08-06：独立「飞书」分组平铺，M3 只读） -->
      <div class="nav-group">
        <div class="nav-group-label">飞书</div>
        <button class="session-item readonly" data-session="f1">
          <span class="s-title">与 OPC 助手的单聊</span>
          <span class="s-meta">12:10</span>
        </button>
        <button class="session-item readonly" data-session="f2">
          <span class="s-title">日报通知群</span>
          <span class="s-meta">昨天</span>
        </button>
      </div>
    </nav>

    <!-- 设置：左下角 gear → 进入管理区（双区模型拍板 2026-08-06：
         会话区左导纯会话；管理区 = 旧应用壳原样保留 + 返回对话） -->
    <div class="sidebar-settings">
      <button class="nav-page" id="open-admin">⚙ 设置</button>
    </div>

    <!-- 原型专用控件（非产品 UI）：切换错误态/空态 -->
    <div class="sidebar-footer">
      <div class="proto-label">— 原型状态切换（非产品 UI）—</div>
      <div class="proto-links">
        <button data-proto="fresh">空态·首次</button>
        <button data-proto="unconfigured">agent 未配置</button>
        <button data-proto="restore">还原</button>
      </div>
    </div>
  </aside>

  <!-- ========== 右栏：对话窗 ========== -->
  <main class="chat">
    <div class="chat-header">
      <h2 class="chat-title" id="chat-title">看看最近的执行情况</h2>
      <span class="status-badge badge-muted" id="chat-space-badge">通用</span>
    </div>

    <!-- 消息区 -->
    <div class="messages" id="messages"></div>

    <!-- 空态（新对话/首次）：仅标题 + 当前空间提示；
         引导卡已拍板砍掉（2026-08-06：非 toC，agent 能力自定义，给不出诚实建议） -->
    <div class="empty-state" id="empty-state" hidden>
      <h2 class="empty-title">有什么可以帮你？</h2>
      <p class="empty-sub">当前空间：<span class="space-name" id="empty-space-name">通用</span></p>
    </div>

    <!-- agent 未配置引导态（§8 错误态） -->
    <div class="empty-state" id="unconfigured-state" hidden>
      <div class="guide-card">
        <h2 class="empty-title" style="font-size: var(--ch-text-xl);">尚未配置 Agent</h2>
        <p>配置 LLM 供应商与 API key 后即可开始对话。<br>配置入口：设置 → Agent 配置。</p>
        <button class="btn btn-primary" onclick="alert('原型：跳转 设置 → Agent 配置 tab')">去配置</button>
      </div>
    </div>

    <!-- 输入区（S3）；只读/禁用态按空间切换 -->
    <div class="composer" id="composer">
      <div class="composer-chips" id="composer-chips">
        <span class="ctx-chip" id="ctx-chip-space">通用</span>
      </div>
      <div class="composer-row">
        <textarea class="composer-input" id="composer-input" rows="1" placeholder="随心输入…"></textarea>
        <button class="btn btn-primary" id="send-btn">发送</button>
      </div>
    </div>
    <div class="composer" id="composer-readonly" hidden>
      <div class="composer-disabled" id="readonly-reason">飞书会话 · 请到飞书继续对话</div>
    </div>
  </main>
</div>

<!-- ========== 管理区（旧应用壳原样保留；左导同旧版 + 顶部「返回对话」） ========== -->
<div class="app" id="screen-admin" hidden>
  <aside class="sidebar">
    <div class="sidebar-header">
      <button class="btn btn-secondary" id="back-to-chat">← 返回对话</button>
    </div>
    <nav class="session-nav" aria-label="管理区导航">
      <div class="nav-group">
        <button class="nav-page admin-nav" data-admin="dashboard">仪表盘</button>
        <button class="nav-page admin-nav" data-admin="workspace">工作区</button>
        <button class="nav-page admin-nav" data-admin="flows">流程</button>
        <button class="nav-page admin-nav" data-admin="executions">执行</button>
        <button class="nav-page admin-nav" data-admin="sources">内容源</button>
        <button class="nav-page admin-nav" data-admin="skills">技能</button>
        <button class="nav-page admin-nav" data-admin="notifications">通知</button>
        <button class="nav-page admin-nav active" data-admin="settings">设置</button>
      </div>
    </nav>
  </aside>
  <main class="chat">
    <div class="page-view" id="admin-view"></div>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
const messagesEl = $("messages");

/* ================= 数据：会话与消息（原型样本） ================= */
const SPACES = {
  general: { badge: "通用", readonly: false },
  project: { badge: "项目", readonly: false },
  feishu:  { badge: "飞书 · 只读", readonly: true },
  orphan:  { badge: "项目已删除", readonly: true, reason: "项目已删除，仅可回看" },
};

/* 确认卡（S5/S8）：kind=danger|script；交互见 bindConfirm() */
function confirmCardHtml(id, kind, title, descHtml) {
  const kindLabel = kind === "script" ? "脚本执行" : "高危操作";
  return `
  <div class="confirm-card" data-confirm="${id}">
    <p class="confirm-title"><span class="warn-badge">${kindLabel}</span>${title}</p>
    <p class="confirm-desc">${descHtml}</p>
    <div class="confirm-actions">
      <button class="btn btn-danger" data-act="approve">确认执行</button>
      <button class="btn btn-secondary" data-act="reject">拒绝</button>
    </div>
  </div>`;
}

const CONVERSATIONS = {
  g1: {
    title: "看看最近的执行情况", space: "general",
    messages: [
      { role: "user", text: "看看最近的执行情况", time: "14:32" },
      { role: "agent", html: `最近 24 小时共 6 次执行：
        <ul class="result-list">
          <li><span class="dot ok"></span>日报生成 · knowledge · 成功 · 12:00</li>
          <li><span class="dot ok"></span>速存收集 · workstation · 成功 · 09:41</li>
          <li><span class="dot err"></span>视频合成 · BanshanJourney · 失败 · 08:15</li>
          <li><span class="dot run"></span>文章发布 · knowledge · 执行中 · 08:02</li>
        </ul>
        失败的那次是素材缺失，要我展开日志吗？`, time: "14:32" },
      { role: "user", text: "不用了。把 old-blog 的日报 flow 删了吧", time: "14:33" },
      { role: "confirm", id: "c1", kind: "danger", title: "删除流程",
        desc: `agent 请求执行 <code>opc-workstation flow delete old-blog-daily</code>。该操作不可恢复，确认后执行。`,
        approveReply: "已删除流程 old-blog-daily。关联的定时任务也已停用。", rejectReply: "已取消删除，流程保持原样。" },
    ],
  },
  g2: {
    title: "跑一下日报流程", space: "general",
    messages: [
      { role: "user", text: "跑一下日报流程", time: "昨天 18:20" },
      { role: "agent", html: `已触发执行 <b>#118</b>（日报生成 · knowledge）。完成后我会在通知里告诉你。`, time: "昨天 18:20" },
    ],
  },
  p1: {
    title: "总结一下 README 和最近改动", space: "project", project: "knowledge",
    messages: [
      { role: "user", text: "总结一下 README 和最近改动", time: "13:58" },
      { role: "agent", html: `
        <div class="tool-row"><span class="tool-tag">读文件</span><code>README.md</code></div>
        <div class="tool-row"><span class="tool-tag">读文件</span><code>CHANGELOG.md</code></div>
        这个项目是你的知识沉淀库，核心是按主题组织的 markdown 集合。最近改动集中在 <code>ai/</code> 目录，新增了 3 篇关于 agent 工作流的笔记……`, time: "13:58" },
    ],
  },
  p2: {
    title: "把 vendor 的同步脚本跑通", space: "project", project: "knowledge",
    messages: [
      { role: "user", text: "把 vendor 的同步脚本跑通，先 dry-run 看看", time: "周一 16:05" },
      { role: "confirm", id: "c2", kind: "script", title: "运行脚本",
        desc: `agent 请求在项目目录执行 <code>bash scripts/vendor-sync.sh --dry-run</code>。脚本来源：skill <code>vendor-tools</code>。`,
        approveReply: "dry-run 完成：将同步 14 个文件，无冲突。要我正式跑一遍吗？", rejectReply: "已取消，脚本未执行。" },
    ],
  },
  p3: {
    title: "昨晚定时任务为什么失败", space: "project", project: "workstation",
    messages: [
      { role: "user", text: "昨晚定时任务为什么失败", time: "周日 09:12" },
      { role: "agent", html: `昨晚 02:00 的「速存收集」执行失败：来源「湾区日报」抓取超时（连续 3 次）。已按重试策略跳过。建议检查该内容源的可用性。`, time: "周日 09:13" },
    ],
  },
  f1: {
    title: "与 OPC 助手的单聊", space: "feishu",
    messages: [
      { role: "user", text: "看看最近的执行情况", time: "12:08" },
      { role: "agent", html: `最近 24 小时共 6 次执行：4 成功 / 1 失败 / 1 执行中。失败的是「视频合成」（素材缺失）。`, time: "12:09" },
      { role: "user", text: "把失败的重新跑一下", time: "12:10" },
      { role: "agent", html: `已重新触发执行 <b>#121</b>（视频合成 · BanshanJourney），进度我会用卡片同步给你。`, time: "12:10" },
    ],
  },
  f2: {
    title: "日报通知群", space: "feishu",
    messages: [
      { role: "agent", html: `【通知】日报生成已完成（执行 #117），产物：<code>reports/2026-08-04.md</code>`, time: "昨天 12:00" },
    ],
  },
  orphan: {
    title: "日报模板再改一版", space: "orphan",
    messages: [
      { role: "user", text: "日报模板再改一版，标题带上日期", time: "上周五" },
      { role: "agent", html: `已更新 <code>templates/daily.md</code>，标题格式改为「日报 · YYYY-MM-DD」。`, time: "上周五" },
    ],
  },
};

/* ================= 管理区（双区模型：旧应用壳原样保留，页面本体零改动） ================= */
const ADMIN_PAGES = {
  dashboard: { title: "仪表盘", html: `
    <div class="stat-cards">
      <div class="stat-card"><div class="sc-value">6</div><div class="sc-label">今日执行</div></div>
      <div class="stat-card"><div class="sc-value">3</div><div class="sc-label">启用中的定时任务</div></div>
      <div class="stat-card"><div class="sc-value">4</div><div class="sc-label">项目</div></div>
      <div class="stat-card"><div class="sc-value">1</div><div class="sc-label">失败待处理</div></div>
    </div>` },
  workspace: { title: "工作区" },
  flows: { title: "流程" },
  executions: { title: "执行" },
  sources: { title: "内容源" },
  skills: { title: "技能" },
  notifications: { title: "通知" },
  settings: { title: "设置", note: "四 tab：通用 / Agent 配置 / 飞书通道 / 关于与更新（settings-tabs 原型已拍板，本体不变）" },
};

function renderAdmin(key) {
  const p = ADMIN_PAGES[key];
  $("admin-view").innerHTML = `
    <h2>${p.title}</h2>
    <p class="pv-note">原型占位：此处为既有「${p.title}」页面原样（路由/页面本体/E2E 均不变）。${p.note || ""}</p>
    ${p.html || ""}`;
  document.querySelectorAll(".admin-nav").forEach(el => el.classList.toggle("active", el.dataset.admin === key));
}

$("open-admin").addEventListener("click", () => {
  $("screen-chat").hidden = true;
  $("screen-admin").hidden = false;
  renderAdmin("settings");
});
$("back-to-chat").addEventListener("click", () => {
  $("screen-admin").hidden = true;
  $("screen-chat").hidden = false;
});
document.querySelectorAll(".admin-nav").forEach(el =>
  el.addEventListener("click", () => renderAdmin(el.dataset.admin))
);

/* ================= 状态与渲染 ================= */
let current = { session: "g1", space: "general", project: null };
let streaming = false;

function renderConversation(key) {
  const conv = CONVERSATIONS[key];
  current = { session: key, space: conv.space, project: conv.project || null };
  $("chat-title").textContent = conv.title;
  const badge = SPACES[conv.space];
  $("chat-space-badge").textContent = conv.project ? `项目 · ${conv.project}` : badge.badge;

  $("empty-state").hidden = true;
  $("unconfigured-state").hidden = true;
  messagesEl.hidden = false;
  messagesEl.innerHTML = "";
  conv.messages.forEach(appendMessage);

  // 输入区：只读空间（飞书/孤儿）无输入入口（业务规则 7.1）
  const ro = SPACES[conv.space].readonly;
  $("composer").hidden = ro;
  $("composer-readonly").hidden = !ro;
  if (ro) $("readonly-reason").textContent = SPACES[conv.space].reason || "飞书会话 · 请到飞书继续对话";
  $("ctx-chip-space").textContent = conv.project ? `项目：${conv.project}` : "通用";

  document.querySelectorAll(".session-item").forEach(el => el.classList.toggle("active", el.dataset.session === key));
}

function appendMessage(m) {
  if (m.role === "confirm") {
    messagesEl.insertAdjacentHTML("beforeend", confirmCardHtml(m.id, m.kind, m.title, m.desc));
    bindConfirm(m);
    return;
  }
  const div = document.createElement("div");
  div.className = `msg ${m.role}`;
  div.innerHTML = `<div class="bubble">${m.html || escapeHtml(m.text)}<span class="b-time">${m.time || ""}</span></div>`;
  messagesEl.appendChild(div);
}

function escapeHtml(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

/* 确认卡交互（S5：确认/拒绝回调驱动，卡片留在历史中可稍后处理） */
function bindConfirm(m) {
  const card = messagesEl.querySelector(`[data-confirm="${m.id}"]`);
  card.querySelectorAll("[data-act]").forEach(btn => {
    btn.addEventListener("click", () => {
      const approved = btn.dataset.act === "approve";
      card.classList.add("done");
      card.querySelector(".confirm-actions").innerHTML =
        `<span class="confirm-result">${approved ? "✓ 已确认 · 执行中" : "✕ 已拒绝"}（原型：回调驱动，确认与执行解耦）</span>`;
      streamAgentReply(approved ? m.approveReply : m.rejectReply);
    }, { once: true });
  });
}

/* 发送 + 模拟流式回复（S3：流式渲染） */
function sendMessage(text) {
  if (!text.trim() || streaming) return;
  streaming = true;
  $("send-btn").disabled = true;
  appendMessage({ role: "user", text, time: "现在" });
  streamAgentReply("（原型模拟流式回复——实际回复由 PI agent 经 CLI 工具面产生，逐字渲染即为此效果。）");
  $("composer-input").value = "";
}

function streamAgentReply(fullText) {
  const div = document.createElement("div");
  div.className = "msg agent";
  div.innerHTML = `<div class="bubble streaming"></div>`;
  messagesEl.appendChild(div);
  const bubble = div.querySelector(".bubble");
  let i = 0;
  const timer = setInterval(() => {
    bubble.textContent = fullText.slice(0, ++i);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    if (i >= fullText.length) {
      clearInterval(timer);
      bubble.classList.remove("streaming");
      streaming = false;
      $("send-btn").disabled = false;
    }
  }, 24);
}

/* 空态（新对话）。归属规则（2026-08-06 拍板）：
   顶部「新对话」= 通用空间；项目行「+」= 该项目空间。（新对话仅存在于会话区） */
function showEmptyState(force) {
  const target = force || { space: "general", project: null };
  const inProject = target.space === "project";
  const spaceName = inProject ? `项目 · ${target.project}` : "通用";
  current = { session: null, space: target.space, project: target.project || null };
  $("chat-title").textContent = "新对话";
  $("chat-space-badge").textContent = spaceName;
  messagesEl.hidden = true;
  $("unconfigured-state").hidden = true;
  $("empty-state").hidden = false;
  $("empty-space-name").textContent = spaceName;
  $("composer").hidden = false;
  $("composer-readonly").hidden = true;
  $("ctx-chip-space").textContent = spaceName;

  document.querySelectorAll(".session-item").forEach(el => el.classList.remove("active"));
}

/* ================= 事件绑定 ================= */
document.querySelectorAll(".session-item").forEach(el =>
  el.addEventListener("click", () => renderConversation(el.dataset.session))
);

document.querySelectorAll(".nav-project").forEach(el =>
  el.addEventListener("click", () => {
    const box = document.querySelector(`[data-project-sessions="${el.dataset.project}"]`);
    const open = box.hidden;
    box.hidden = !open;
    el.setAttribute("aria-expanded", String(open));
    el.querySelector(".chev").textContent = open ? "▾" : "▸";
  })
);

$("new-chat-btn").addEventListener("click", () => showEmptyState({ space: "general", project: null }));

/* 项目行内「+」：该项目空间新对话（阻止冒泡到分组展开；自动展开该分组） */
document.querySelectorAll("[data-add-project]").forEach(el =>
  el.addEventListener("click", (e) => {
    e.stopPropagation();
    const name = el.dataset.addProject;
    const box = document.querySelector(`[data-project-sessions="${name}"]`);
    if (box && box.hidden) {
      box.hidden = false;
      const row = document.querySelector(`.nav-project[data-project="${name}"]`);
      row.setAttribute("aria-expanded", "true");
      row.querySelector(".chev").textContent = "▾";
    }
    showEmptyState({ space: "project", project: name });
  })
);

$("send-btn").addEventListener("click", () => sendMessage($("composer-input").value));
$("composer-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(e.target.value); }
});

/* 原型专用状态切换（非产品 UI） */
document.querySelectorAll("[data-proto]").forEach(el =>
  el.addEventListener("click", () => {
    const mode = el.dataset.proto;
    if (mode === "fresh") { current = { session: null, space: "general", project: null }; showEmptyState(); }
    if (mode === "unconfigured") {
      messagesEl.hidden = true; $("empty-state").hidden = true;
      $("unconfigured-state").hidden = false;
      $("composer").hidden = false; $("composer-readonly").hidden = true;
      $("composer-input").disabled = true; $("send-btn").disabled = true;
      $("chat-title").textContent = "助手";
    }
    if (mode === "restore") {
      $("composer-input").disabled = false; $("send-btn").disabled = false;
      renderConversation("g1");
    }
  })
);

/* 初始渲染 */
renderConversation("g1");
messagesEl.scrollTop = messagesEl.scrollHeight;
</script>
</body>
</html>
