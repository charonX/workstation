story_id: 2026-07-29-multi-agent-skills
intention: >-
  当前 skill 的管理与分发和单一 agent 的目录结构耦合；当项目需要同时支持多种 AI agent 时，
  不同 agent 对 skill 安装目录的要求不同，同步 skill 只能手工维护，
  无法按项目声明的 agent 类型自动适配。

