story_id: 2026-08-19-feishu-reset-history-archive
intention: >-
  飞书 /reset 后，之前的历史对话在 UI 会话列表中彻底不可见、不可回看——用户期望
  reset 把当前会话归档为可读的历史条目（列表多出一条），并开启新会话。   # 一句话痛点,非方案。这是 story 的初衷,方案会变,痛点不会。

phase: BUILD      # THINK / PRD / DESIGN / DOMAIN-MODEL / TECH-DESIGN(仅 complex；simple 直接结晶) / CRYSTALLIZE / TEST / ASSERTION-SIGNOFF / BUILD / QA / BUG / REFLECT
                  # 注：CRYSTALLIZE → TEST → ASSERTION-SIGNOFF 由 /story 自动链一次推进（仅升级点停下；单独调子 skill 也可推进）；其余阶段逐阶段路由。
attempt: 1        # 第几次尝试。归档重做时 +1。
bug-counter: 0    # story 内 bug 计数，/bug 每次修复 +1，用于 commit [bugfix] BUG-NNN。
created: 2026-08-19
status: active    # active / completed。由 /reflect 原地归档时置为 completed；已完成 story 的 spec 是历史记录（逻辑看代码、意图看全局文档），回流判断可查。
