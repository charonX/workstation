intention: >-
  「如何运行一次执行」的知识无属主：run options 三处手工拼装且已漂移
  （debug 合成 phantom parentExecutionId、subflow 绕过 generation 守卫、
  250ms 观察睡眠隐形成本），执行上下文重置有双机制（queue destroy +
  generation）互为补丁。一句话痛点：一次执行的生命周期知识散在三处，
  删除测试证明无属主，改动一次跨 N 处。   # 一句话痛点,非方案。这是 story 的初衷,方案会变,痛点不会。

