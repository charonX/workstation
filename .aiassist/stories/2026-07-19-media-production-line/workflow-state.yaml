# Test-as-Contract workflow state
# 由 /story 创建和维护。本文件是状态机,不归档(回流时更新,不搬进 archive/)。

story_id: 2026-07-19-media-production-line
intention: >-
  workstation 撑不起「模板+数据→媒体产物」这类生产线工作流：调度是空壳、无产物模型、
  agent 输出无结构化契约，内容创作者无法把重复性媒体生产（如短视频日更）沉淀进系统。

phase: TEST       # THINK / PRD / DESIGN / DOMAIN-MODEL / TECH-DESIGN / CRYSTALLIZE / TEST / ASSERTION-SIGNOFF / BUILD / QA / BUG / REFLECT
attempt: 1        # 第几次尝试。归档重做时 +1。
bug-counter: 0    # story 内 bug 计数，/bug 每次修复 +1，用于 commit [bugfix] BUG-NNN。
created: 2026-07-19

