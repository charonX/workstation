<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>通知 · OPC Workstation</title>
  <link rel="stylesheet" href="_ds/global/tokens.css">
  <link rel="stylesheet" href="_ds/global/styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: var(--ch-font-sans);
      font-size: var(--ch-text-base);
      line-height: var(--ch-leading-normal);
      background: var(--ch-bg);
      color: var(--ch-text);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; border: 0; background: transparent; color: inherit; }

    /* ─── app shell ─── */
    .app-shell {
      display: grid;
      grid-template-columns: var(--ch-sidebar-width) 1fr;
      grid-template-rows: var(--ch-topbar-height) 1fr;
      height: 100vh;
      overflow: hidden;
    }
    .app-main { grid-row: 2; grid-column: 2; overflow: auto; padding: var(--ch-panel-padding); }

    /* ─── topbar ─── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      height: var(--ch-topbar-height); padding: 0 var(--ch-panel-padding);
      background: var(--ch-surface); border-bottom: 1px solid var(--ch-border);
      grid-row: 1; grid-column: 1 / -1; gap: var(--ch-space-4);
    }
    .topbar-left { display: flex; align-items: center; gap: var(--ch-space-4); flex: 1; min-width: 0; }
    .topbar-logo { font-weight: var(--ch-weight-bold); font-size: var(--ch-text-lg); letter-spacing: -0.02em; white-space: nowrap; }
    .topbar-search-form { max-width: 280px; width: 100%; }
    .topbar-search-input {
      width: 100%; padding: 6px 12px; background: var(--ch-surface-highest);
      border: 1px solid var(--ch-border); border-radius: var(--ch-radius-md);
      color: var(--ch-text); font-size: var(--ch-text-sm); outline: none; font-family: var(--ch-font-sans);
    }
    .topbar-search-input:focus { border-color: var(--ch-accent); }
    .topbar-right { display: flex; align-items: center; gap: var(--ch-space-3); flex-shrink: 0; }
    .icon-btn {
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--ch-border); border-radius: var(--ch-radius-md);
      background: transparent; color: var(--ch-text-secondary); transition: background 0.15s ease, color 0.15s ease;
    }
    .icon-btn:hover { background: var(--ch-surface-high); color: var(--ch-text); }

    /* ─── sidebar ─── */
    .sidebar {
      display: flex; flex-direction: column; background: var(--ch-surface);
      border-right: 1px solid var(--ch-border); grid-row: 2; grid-column: 1; overflow: hidden;
    }
    .sidebar-nav { flex: 1; overflow: auto; display: flex; flex-direction: column; padding: var(--ch-space-2); gap: var(--ch-space-1); }
    .nav-group { margin-bottom: var(--ch-space-4); }
    .nav-label {
      font-size: var(--ch-text-xs); font-weight: var(--ch-weight-medium); color: var(--ch-text-tertiary);
      text-transform: uppercase; letter-spacing: 0.05em; padding: 0 var(--ch-space-3); margin-bottom: var(--ch-space-2);
    }
    .nav-link {
      display: flex; align-items: center; gap: var(--ch-space-2);
      padding: var(--ch-space-2) var(--ch-space-3); color: var(--ch-text-secondary);
      border-radius: var(--ch-radius-md); font-size: var(--ch-text-base); font-weight: var(--ch-weight-medium);
      transition: background 0.15s ease, color 0.15s ease;
    }
    .nav-link:hover { background: var(--ch-surface-high); color: var(--ch-text); }
    .nav-link.active { background: var(--ch-accent-soft); color: var(--ch-accent); }
    .sidebar-bottom { border-top: 1px solid var(--ch-border); padding: var(--ch-space-2); }
    .nav-badge {
      margin-left: auto; background: var(--ch-error); color: #fff;
      border-radius: var(--ch-radius-full); font-size: 10px; font-weight: var(--ch-weight-bold);
      min-width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; padding: 0 5px;
    }
    .nav-badge.hidden { display: none; }

    /* ─── page ─── */
    .page { max-width: 860px; }
    .page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: var(--ch-space-5); gap: var(--ch-space-4); }
    .page-title { font-size: var(--ch-text-xl); font-weight: var(--ch-weight-semibold); margin: 0; }
    .page-subtitle { color: var(--ch-text-secondary); font-size: var(--ch-text-sm); margin: 2px 0 0; }

    .btn {
      display: inline-flex; align-items: center; gap: var(--ch-space-2);
      padding: 6px 14px; border-radius: var(--ch-radius-md); font-weight: var(--ch-weight-semibold);
      font-size: var(--ch-text-sm); border: 1px solid transparent; transition: opacity 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: transparent; border-color: var(--ch-border); color: var(--ch-text); }
    .btn-secondary:hover:not(:disabled) { border-color: var(--ch-border-strong); background: var(--ch-surface-high); }

    /* ─── filter tabs ─── */
    .tabs { display: flex; gap: var(--ch-space-1); border-bottom: 1px solid var(--ch-border); margin-bottom: var(--ch-space-4); }
    .tab {
      padding: var(--ch-space-2) var(--ch-space-4); border-bottom: 2px solid transparent;
      color: var(--ch-text-secondary); font-size: var(--ch-text-sm); font-weight: var(--ch-weight-medium);
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .tab:hover { color: var(--ch-text); }
    .tab.active { color: var(--ch-accent); border-bottom-color: var(--ch-accent); }
    .tab-count { font-family: var(--ch-font-mono); font-size: var(--ch-text-xs); color: var(--ch-text-tertiary); margin-left: 4px; }
    .tab.active .tab-count { color: var(--ch-accent); }

    /* ─── notification list ─── */
    .ntf-list { display: flex; flex-direction: column; gap: var(--ch-space-2); }
    .ntf-item {
      display: flex; gap: var(--ch-space-3); align-items: flex-start;
      background: var(--ch-surface); border: 1px solid var(--ch-border); border-radius: var(--ch-radius-lg);
      padding: var(--ch-space-3) var(--ch-space-4); transition: border-color 0.15s ease, background 0.15s ease;
      position: relative;
    }
    .ntf-item:hover { border-color: var(--ch-border-strong); }
    .ntf-item.unread { border-left: 2px solid var(--ch-accent); }
    .ntf-item.clickable { cursor: pointer; }
    .ntf-item.clickable:hover { background: var(--ch-surface-high); }
    .ntf-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
    .ntf-dot.success { background: var(--ch-success); }
    .ntf-dot.error { background: var(--ch-error); }
    .ntf-dot.warning { background: var(--ch-warning); }
    .ntf-main { flex: 1; min-width: 0; }
    .ntf-title-row { display: flex; align-items: center; gap: var(--ch-space-2); }
    .ntf-title { font-size: var(--ch-text-base); color: var(--ch-text); font-weight: var(--ch-weight-normal); }
    .ntf-item.unread .ntf-title { font-weight: var(--ch-weight-semibold); }
    .ntf-unread-pill {
      background: var(--ch-accent-soft); color: var(--ch-accent); border-radius: var(--ch-radius-full);
      font-size: 10px; font-weight: var(--ch-weight-semibold); padding: 0 6px; line-height: 16px; flex-shrink: 0;
    }
    .ntf-time { margin-left: auto; font-size: var(--ch-text-xs); color: var(--ch-text-tertiary); font-family: var(--ch-font-mono); flex-shrink: 0; }
    .ntf-summary { font-size: var(--ch-text-sm); color: var(--ch-text-secondary); margin-top: 2px; word-break: break-all; }
    .ntf-summary .mono { font-family: var(--ch-font-mono); font-size: var(--ch-text-xs); }
    .ntf-meta { display: flex; align-items: center; gap: var(--ch-space-3); margin-top: var(--ch-space-2); }
    .ntf-exec { font-family: var(--ch-font-mono); font-size: var(--ch-text-xs); color: var(--ch-text-tertiary); }
    .ntf-goto { font-size: var(--ch-text-xs); color: var(--ch-accent); font-weight: var(--ch-weight-medium); }
    .ntf-item.clickable:hover .ntf-goto { text-decoration: underline; }
    .ntf-actions { flex-shrink: 0; }
    .mark-read-btn {
      font-size: var(--ch-text-xs); color: var(--ch-text-secondary); border: 1px solid var(--ch-border);
      border-radius: var(--ch-radius-md); padding: 3px 10px; transition: color 0.15s ease, border-color 0.15s ease;
    }
    .mark-read-btn:hover { color: var(--ch-accent); border-color: var(--ch-accent); }

    .list-empty { padding: var(--ch-space-10) var(--ch-space-4); text-align: center; color: var(--ch-text-secondary); font-size: var(--ch-text-sm); }

    /* ─── toast ─── */
    .toast-root { position: fixed; right: var(--ch-space-5); bottom: var(--ch-space-5); z-index: 2000; display: flex; flex-direction: column; gap: var(--ch-space-2); }
    .toast {
      background: var(--ch-surface-highest); border: 1px solid var(--ch-border-strong); border-radius: var(--ch-radius-md);
      box-shadow: var(--ch-shadow-md); padding: var(--ch-space-2) var(--ch-space-4); font-size: var(--ch-text-sm); color: var(--ch-text);
      opacity: 0; transform: translateY(6px); transition: opacity 0.2s ease, transform 0.2s ease; max-width: 420px;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-left">
        <div class="topbar-logo">OPC Workstation</div>
        <form class="topbar-search-form" onsubmit="return false;">
          <input type="search" class="topbar-search-input" placeholder="搜索项目、流程、执行…" aria-label="搜索" />

          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        </button>
        <button type="button" class="icon-btn" aria-label="切换主题" title="切换主题">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
        <a class="icon-btn" href="notifications.html" aria-label="通知" title="通知">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>

        <a class="icon-btn" href="settings-channel.html" aria-label="设置" title="设置">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06-.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83-2.83l.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1 1.51V3"/></svg>
        </a>
      </div>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <div class="nav-group">
          <div class="nav-label">工作区</div>
          <a class="nav-link" href="#">概览</a>
          <a class="nav-link" href="#">工作区</a>
          <a class="nav-link" href="#">流程</a>
          <a class="nav-link" href="execution-detail.html">执行历史</a>
          <a class="nav-link" href="sources.html">内容源</a>
        </div>
        <div class="nav-group">
          <div class="nav-label">系统</div>
          <a class="nav-link" href="#">技能</a>
          <a class="nav-link" href="settings-channel.html">设置</a>
        </div>
      </nav>
      <div class="sidebar-bottom">
        <a class="nav-link active" href="notifications.html">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span>通知</span>
          <span class="nav-badge" id="navBadge">4</span>
        </a>
      </div>
    </aside>

    <!-- Main -->
    <main class="app-main">
      <div class="page">
        <div class="page-header">
          <div>
            <h1 class="page-title">通知</h1>
            <p class="page-subtitle">系统事件：产物产出、执行失败、通道掉线与恢复。</p>
          </div>
          <button type="button" class="btn btn-secondary" id="markAllBtn">全部标为已读</button>
        </div>

        <div class="tabs" id="filterTabs" role="tablist"></div>
        <div class="ntf-list" id="ntfList"></div>
      </div>
    </main>
  </div>

  <div class="toast-root" id="toastRoot"></div>

  <script src="_ds/global/_ds_bundle.js"></script>
  <script>
    'use strict';

    /* ─── mock 数据（对应 PRD §4 稳定块 10：通知实体 类型/标题/摘要/时间/已读/关联执行） ─── */
    const state = {
      filter: 'all',
      notifications: [
        { id: 'ntf-1007', type: 'artifact', title: 'AI 科技日报已生成', summary: 'outputs/daily/2026-07-19-ai-daily.md · 14 条 · 4 个版块 · 已同步飞书云文档', time: '今天 10:02', execId: 'exec-1042', read: false },
        { id: 'ntf-1006', type: 'artifact', title: '链接速存成功', summary: 'materials/2026-07-19-building-effective-agents.md · 来自飞书消息 · 索引已追加', time: '今天 09:32', execId: 'exec-1041', read: false },
        { id: 'ntf-1005', type: 'error', title: '「AI 科技日报」执行失败', summary: 'agent 节点重试耗尽（3/3）：量子位公众号抓取超时（E-AGENT-FAILED）', time: '昨天 10:04', execId: 'exec-1039', read: false },
        { id: 'ntf-1004', type: 'channel', level: 'down', title: '飞书通道掉线', summary: '长连接断开，自动重连失败（E-CHANNEL-DOWN）；期间消息可能丢失', time: '昨天 08:12', execId: null, read: false },
        { id: 'ntf-1003', type: 'channel', level: 'recovered', title: '飞书通道已恢复', summary: '长连接重新建立，通道恢复在线', time: '昨天 08:20', execId: null, read: true },
        { id: 'ntf-1002', type: 'artifact', title: 'AI 科技日报已生成', summary: 'outputs/daily/2026-07-18-ai-daily.md · 12 条 · 4 个版块', time: '07-18 10:03', execId: 'exec-1036', read: true },
        { id: 'ntf-1001', type: 'error', title: '链接速存失败', summary: '抓取失败：目标链接返回 404（E-FETCH-FAILED），未落盘', time: '07-18 09:15', execId: 'exec-1035', read: true },
      ],
    };

    const FILTERS = [
      { key: 'all', label: '全部' },
      { key: 'artifact', label: '产物产出' },
      { key: 'error', label: '执行失败' },
      { key: 'channel', label: '通道状态' },
    ];

    /* ─── utils ─── */
    const $ = (sel) => document.querySelector(sel);
    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function toast(msg) {
      const root = $('#toastRoot');
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      root.appendChild(el);
      requestAnimationFrame(() => el.classList.add('show'));
      setTimeout(() => {
        el.classList.remove('show');
        setTimeout(() => el.remove(), 220);
      }, 2600);
    }

    function dotClass(n) {
      if (n.type === 'artifact') return 'success';
      if (n.type === 'error') return 'error';
      return n.level === 'down' ? 'warning' : 'success';
    }
    function unreadCount() {
      return state.notifications.filter((n) => !n.read).length;
    }

    /* ─── 渲染 ─── */
    function renderBadge() {
      const count = unreadCount();
      const badge = $('#navBadge');
      badge.textContent = count;
      badge.classList.toggle('hidden', count === 0);
      $('#markAllBtn').disabled = count === 0;
    }

    function renderTabs() {
      $('#filterTabs').innerHTML = FILTERS.map((f) => {
        const count = f.key === 'all'
          ? state.notifications.length
          : state.notifications.filter((n) => n.type === f.key).length;
        return `<button type="button" role="tab" aria-selected="${state.filter === f.key}"
                  class="tab${state.filter === f.key ? ' active' : ''}" data-filter="${f.key}">
                  ${f.label}<span class="tab-count">${count}</span>
                </button>`;
      }).join('');
    }

    function renderList() {
      const list = state.notifications.filter((n) => state.filter === 'all' || n.type === state.filter);
      const box = $('#ntfList');
      if (list.length === 0) {
        box.innerHTML = '<div class="list-empty">该分类下暂无通知。</div>';
        return;
      }
      box.innerHTML = list.map((n) => {
        const clickable = n.type === 'artifact';
        return `
          <div class="ntf-item${n.read ? '' : ' unread'}${clickable ? ' clickable' : ''}" data-id="${esc(n.id)}"
               ${clickable ? 'role="button" tabindex="0" title="查看关联执行与产物"' : ''}>
            <span class="ntf-dot ${dotClass(n)}"></span>
            <div class="ntf-main">
              <div class="ntf-title-row">
                <span class="ntf-title">${esc(n.title)}</span>
                ${n.read ? '' : '<span class="ntf-unread-pill">未读</span>'}
                <span class="ntf-time">${esc(n.time)}</span>
              </div>
              <div class="ntf-summary"><span class="mono">${esc(n.summary)}</span></div>
              <div class="ntf-meta">
                ${n.execId ? `<span class="ntf-exec">关联执行 ${esc(n.execId)}</span>` : ''}
                ${clickable ? '<span class="ntf-goto">查看执行与产物 →</span>' : ''}
              </div>
            </div>
            <div class="ntf-actions">
              ${n.read ? '' : `<button type="button" class="mark-read-btn" data-mark="${esc(n.id)}">标为已读</button>`}
            </div>
          </div>`;
      }).join('');
    }

    function renderAll() {
      renderBadge();
      renderTabs();
      renderList();
    }

    /* ─── 交互 ─── */
    function markRead(id) {
      const n = state.notifications.find((x) => x.id === id);
      if (!n || n.read) return;
      n.read = true;
      renderAll();
    }

    $('#markAllBtn').addEventListener('click', () => {
      const had = unreadCount();
      state.notifications.forEach((n) => { n.read = true; });
      renderAll();
      if (had > 0) toast(`已将 ${had} 条通知标为已读`);
    });

    $('#filterTabs').addEventListener('click', (e) => {
      const tab = e.target.closest('[data-filter]');
      if (!tab) return;
      state.filter = tab.dataset.filter;
      renderTabs();
      renderList();
    });

    $('#ntfList').addEventListener('click', (e) => {
      const markBtn = e.target.closest('[data-mark]');
      if (markBtn) {
        e.stopPropagation();
        markRead(markBtn.dataset.mark);
        return;
      }
      const item = e.target.closest('.ntf-item.clickable');
      if (item) {
        // 「产物产出」类通知 → 跳转执行详情（产物 tab）
        location.href = 'execution-detail.html';
      }
    });
    $('#ntfList').addEventListener('keydown', (e) => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('ntf-item')) {
        e.preventDefault();
        location.href = 'execution-detail.html';
      }
    });

    renderAll();
  </script>
</body>
