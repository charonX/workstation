  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: var(--ch-font-sans);
      font-size: var(--ch-text-base);
      line-height: var(--ch-leading-normal);
      background: var(--ch-bg);
      color: var(--ch-text);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; border: 0; background: transparent; color: inherit; }

    /* ─── app shell ─── */
    .app-shell {
      display: grid;
      grid-template-columns: var(--ch-sidebar-width) 1fr;
      grid-template-rows: var(--ch-topbar-height) 1fr;
      height: 100vh;
      overflow: hidden;
    }
    .app-main { grid-row: 2; grid-column: 2; overflow: auto; padding: var(--ch-panel-padding); }

    /* ─── topbar ─── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      height: var(--ch-topbar-height); padding: 0 var(--ch-panel-padding);
      background: var(--ch-surface); border-bottom: 1px solid var(--ch-border);
      grid-row: 1; grid-column: 1 / -1; gap: var(--ch-space-4);
    }
    .topbar-left { display: flex; align-items: center; gap: var(--ch-space-4); flex: 1; min-width: 0; }
    .topbar-logo { font-weight: var(--ch-weight-bold); font-size: var(--ch-text-lg); letter-spacing: -0.02em; white-space: nowrap; }
    .topbar-search-form { max-width: 280px; width: 100%; }
    .topbar-search-input {
      width: 100%; padding: 6px 12px; background: var(--ch-surface-highest);
      border: 1px solid var(--ch-border); border-radius: var(--ch-radius-md);
      color: var(--ch-text); font-size: var(--ch-text-sm); outline: none; font-family: var(--ch-font-sans);
    }
    .topbar-search-input:focus { border-color: var(--ch-accent); }
    .topbar-right { display: flex; align-items: center; gap: var(--ch-space-3); flex-shrink: 0; }
    .icon-btn {
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--ch-border); border-radius: var(--ch-radius-md);
      background: transparent; color: var(--ch-text-secondary); transition: background 0.15s ease, color 0.15s ease;
    }
    .icon-btn:hover { background: var(--ch-surface-high); color: var(--ch-text); }

    /* ─── sidebar ─── */
    .sidebar {
      display: flex; flex-direction: column; background: var(--ch-surface);
      border-right: 1px solid var(--ch-border); grid-row: 2; grid-column: 1; overflow: hidden;
    }
    .sidebar-nav { flex: 1; overflow: auto; display: flex; flex-direction: column; padding: var(--ch-space-2); gap: var(--ch-space-1); }
    .nav-group { margin-bottom: var(--ch-space-4); }
    .nav-label {
      font-size: var(--ch-text-xs); font-weight: var(--ch-weight-medium); color: var(--ch-text-tertiary);
      text-transform: uppercase; letter-spacing: 0.05em; padding: 0 var(--ch-space-3); margin-bottom: var(--ch-space-2);
    }
    .nav-link {
      display: flex; align-items: center; gap: var(--ch-space-2);
      padding: var(--ch-space-2) var(--ch-space-3); color: var(--ch-text-secondary);
      border-radius: var(--ch-radius-md); font-size: var(--ch-text-base); font-weight: var(--ch-weight-medium);
      transition: background 0.15s ease, color 0.15s ease;
    }
    .nav-link:hover { background: var(--ch-surface-high); color: var(--ch-text); }
    .nav-link.active { background: var(--ch-accent-soft); color: var(--ch-accent); }
    .sidebar-bottom { border-top: 1px solid var(--ch-border); padding: var(--ch-space-2); }
    .nav-badge {
      margin-left: auto; background: var(--ch-error); color: #fff;
      border-radius: var(--ch-radius-full); font-size: 10px; font-weight: var(--ch-weight-bold);
      min-width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; padding: 0 5px;
    }

    /* ─── page ─── */
    .page { max-width: 1200px; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--ch-space-6); }
    .page-title { font-size: var(--ch-text-xl); font-weight: var(--ch-weight-semibold); margin: 0; }
    .page-subtitle { color: var(--ch-text-secondary); font-size: var(--ch-text-sm); margin: 2px 0 0; }

    /* ─── execution table ─── */
    .table { width: 100%; border: 1px solid var(--ch-border); border-radius: var(--ch-radius-lg); overflow: hidden; background: var(--ch-surface); margin-bottom: var(--ch-space-5); }
    .table-header, .table-row {
      display: grid; grid-template-columns: 1.6fr 1.2fr 0.9fr 0.9fr 1.3fr 0.7fr;
      gap: var(--ch-space-3); padding: var(--ch-space-2) var(--ch-space-4); align-items: center;
    }
    .table-header {
      background: var(--ch-surface-high); border-bottom: 1px solid var(--ch-border);
      font-size: var(--ch-text-xs); font-weight: var(--ch-weight-medium); color: var(--ch-text-secondary);
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .table-row { border-bottom: 1px solid var(--ch-border); font-size: var(--ch-text-sm); cursor: pointer; transition: background 0.15s ease; padding-top: var(--ch-space-3); padding-bottom: var(--ch-space-3); }
    .table-row:last-child { border-bottom: none; }
    .table-row:hover { background: var(--ch-surface-high); }
    .table-row.active { background: var(--ch-accent-soft); }
    .cell-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .cell-title { font-weight: var(--ch-weight-medium); color: var(--ch-text); }
    .cell-meta { font-size: var(--ch-text-xs); color: var(--ch-text-tertiary); font-family: var(--ch-font-mono); }
    .cell-text { color: var(--ch-text-secondary); font-size: var(--ch-text-sm); }
    .cell-mono { color: var(--ch-text-secondary); font-size: var(--ch-text-xs); font-family: var(--ch-font-mono); }

    /* ─── status ─── */
    .status {
      display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px;
      border-radius: var(--ch-radius-full); font-size: var(--ch-text-xs); font-weight: var(--ch-weight-medium);
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; }
    .status-success { background: var(--ch-success-soft); color: var(--ch-success); }
    .status-success .status-dot { background: var(--ch-success); }
    .status-error { background: var(--ch-error-soft); color: var(--ch-error); }
    .status-error .status-dot { background: var(--ch-error); }
    .status-running { background: var(--ch-accent-soft); color: var(--ch-accent); }
    .status-running .status-dot { background: var(--ch-accent); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* ─── detail panel ─── */
    .detail-panel { border: 1px solid var(--ch-border); border-radius: var(--ch-radius-lg); background: var(--ch-surface); overflow: hidden; }
    .detail-header { display: flex; align-items: center; justify-content: space-between; padding: var(--ch-space-4); border-bottom: 1px solid var(--ch-border); gap: var(--ch-space-4); }
    .detail-title { font-size: var(--ch-text-md); font-weight: var(--ch-weight-semibold); margin: 0; }
    .detail-subtitle { font-size: var(--ch-text-xs); color: var(--ch-text-secondary); font-family: var(--ch-font-mono); margin-top: 2px; }
    .detail-status { display: flex; align-items: center; gap: var(--ch-space-3); flex-shrink: 0; }
    .detail-duration { font-size: var(--ch-text-xs); color: var(--ch-text-tertiary); font-family: var(--ch-font-mono); }
    .detail-tabs { display: flex; gap: var(--ch-space-1); padding: 0 var(--ch-space-4); border-bottom: 1px solid var(--ch-border); }
    .detail-tab {
      padding: var(--ch-space-2) var(--ch-space-3); border-bottom: 2px solid transparent;
      color: var(--ch-text-secondary); font-size: var(--ch-text-sm); font-weight: var(--ch-weight-medium);
      transition: color 0.15s ease, border-color 0.15s ease; display: inline-flex; align-items: center; gap: 6px;
    }
    .detail-tab:hover { color: var(--ch-text); }
    .detail-tab.active { color: var(--ch-accent); border-bottom-color: var(--ch-accent); }
    .tab-chip { background: var(--ch-accent-soft); color: var(--ch-accent); border-radius: var(--ch-radius-full); font-size: 10px; font-weight: var(--ch-weight-semibold); padding: 0 6px; line-height: 16px; }
    .detail-body { padding: var(--ch-space-3) var(--ch-space-4); min-height: 240px; }
    .detail-placeholder { color: var(--ch-text-secondary); text-align: center; padding: var(--ch-space-6) 0; margin: 0; font-size: var(--ch-text-sm); }

    /* ─── nodes tab ─── */
    .execution-node-list { display: flex; flex-direction: column; gap: var(--ch-space-3); }
    .execution-node { border: 1px solid var(--ch-border); border-radius: var(--ch-radius-md); background: var(--ch-surface-high); padding: var(--ch-space-3); }
    .execution-node-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--ch-space-2); }
    .execution-node-name { font-size: var(--ch-text-sm); font-weight: var(--ch-weight-semibold); margin-right: var(--ch-space-2); }
    .execution-node-id { font-family: var(--ch-font-mono); font-size: var(--ch-text-xs); color: var(--ch-text-tertiary); }
    .execution-node-fields { display: grid; grid-template-columns: 140px 1fr; gap: var(--ch-space-1) var(--ch-space-3); font-size: var(--ch-text-xs); }
    .execution-node-field-label { color: var(--ch-text-secondary); font-weight: var(--ch-weight-medium); }
    .execution-node-field-value { font-family: var(--ch-font-mono); color: var(--ch-text); word-break: break-word; }

    /* ─── logs tab ─── */
    .log-entry { font-family: var(--ch-font-mono); font-size: var(--ch-text-xs); padding: var(--ch-space-2) 0; border-bottom: 1px solid var(--ch-border); display: flex; gap: var(--ch-space-3); }
    .log-entry:last-child { border-bottom: none; }
    .log-time { color: var(--ch-text-tertiary); min-width: 80px; flex-shrink: 0; }
    .log-level { color: var(--ch-accent); min-width: 110px; flex-shrink: 0; font-weight: var(--ch-weight-medium); }
    .log-level.error { color: var(--ch-error); }
    .log-msg { color: var(--ch-text-secondary); word-break: break-word; }
    .log-msg.error { color: var(--ch-error); }

    /* ─── variables tab ─── */
    .kv-grid { display: grid; grid-template-columns: 180px 1fr; gap: 1px; border: 1px solid var(--ch-border); border-radius: var(--ch-radius-md); overflow: hidden; font-family: var(--ch-font-mono); font-size: var(--ch-text-xs); }
    .kv-key { background: var(--ch-surface-high); padding: var(--ch-space-2) var(--ch-space-3); color: var(--ch-text-secondary); font-weight: var(--ch-weight-medium); }
    .kv-value { background: var(--ch-surface); padding: var(--ch-space-2) var(--ch-space-3); color: var(--ch-text); word-break: break-word; }

    /* ─── output tab ─── */
    .output-box {
      background: var(--ch-surface-high); border: 1px solid var(--ch-border); border-radius: var(--ch-radius-md);
      padding: var(--ch-space-4); font-family: var(--ch-font-mono); font-size: var(--ch-text-sm);
      white-space: pre-wrap; word-break: break-word; color: var(--ch-text); margin: 0; max-height: 400px; overflow: auto;
    }

    /* ─── artifacts tab（本 story 新增） ─── */
    .artifact-list { display: flex; flex-direction: column; gap: var(--ch-space-3); }
    .artifact-card { border: 1px solid var(--ch-border); border-radius: var(--ch-radius-md); background: var(--ch-surface-high); overflow: hidden; }
    .artifact-row { display: flex; align-items: center; gap: var(--ch-space-3); padding: var(--ch-space-3); transition: background 0.15s ease; }
    .artifact-card:hover { border-color: var(--ch-border-strong); }
    .artifact-icon {
      width: 32px; height: 32px; border-radius: var(--ch-radius-md); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--ch-accent-soft); color: var(--ch-accent);
      font-family: var(--ch-font-mono); font-size: 10px; font-weight: var(--ch-weight-bold);
    }
    .artifact-icon.index { background: var(--ch-info-soft); color: var(--ch-info); }
    .artifact-main { flex: 1; min-width: 0; }
    .artifact-name-row { display: flex; align-items: baseline; gap: var(--ch-space-2); }
    .artifact-name { font-size: var(--ch-text-sm); font-weight: var(--ch-weight-semibold); }
    .artifact-size { font-size: var(--ch-text-xs); color: var(--ch-text-tertiary); font-family: var(--ch-font-mono); }
    .artifact-path { font-family: var(--ch-font-mono); font-size: var(--ch-text-xs); color: var(--ch-text-secondary); word-break: break-all; margin-top: 2px; }
    .artifact-actions { display: flex; gap: var(--ch-space-2); flex-shrink: 0; }
    .btn {
      display: inline-flex; align-items: center; gap: var(--ch-space-2);
      padding: 6px 14px; border-radius: var(--ch-radius-md); font-weight: var(--ch-weight-semibold);
      font-size: var(--ch-text-sm); border: 1px solid transparent; transition: opacity 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .btn-secondary { background: transparent; border-color: var(--ch-border); color: var(--ch-text); }
    .btn-secondary:hover { border-color: var(--ch-border-strong); background: var(--ch-surface-highest); }
    .btn-ghost { background: transparent; color: var(--ch-text-secondary); }
    .btn-ghost:hover { background: var(--ch-surface-highest); color: var(--ch-text); }
    .btn-sm { padding: 4px 10px; font-size: var(--ch-text-xs); }
    .sync-row {
      display: flex; align-items: center; gap: var(--ch-space-2);
      border-top: 1px solid var(--ch-border); padding: var(--ch-space-2) var(--ch-space-3);
      font-size: var(--ch-text-xs); color: var(--ch-text-secondary);
    }
    .sync-row .status-dot { flex-shrink: 0; }
    .sync-row a { color: var(--ch-accent); font-family: var(--ch-font-mono); word-break: break-all; }
    .sync-row a:hover { text-decoration: underline; }
    .sync-row.sync-failed {
      background: var(--ch-warning-soft); color: var(--ch-text);
    }
    .sync-row.sync-failed strong { color: var(--ch-warning); }
    .artifacts-note { font-size: var(--ch-text-xs); color: var(--ch-text-tertiary); margin: var(--ch-space-3) 0 0; }

    /* ─── toast ─── */
    .toast-root { position: fixed; right: var(--ch-space-5); bottom: var(--ch-space-5); z-index: 2000; display: flex; flex-direction: column; gap: var(--ch-space-2); }
    .toast {
      background: var(--ch-surface-highest); border: 1px solid var(--ch-border-strong); border-radius: var(--ch-radius-md);
      box-shadow: var(--ch-shadow-md); padding: var(--ch-space-2) var(--ch-space-4); font-size: var(--ch-text-sm); color: var(--ch-text);
      opacity: 0; transform: translateY(6px); transition: opacity 0.2s ease, transform 0.2s ease; max-width: 460px;
      font-family: var(--ch-font-mono); font-size: var(--ch-text-xs);
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>

    'use strict';

    /* ─── mock 数据：4 条执行记录（覆盖 schedule / channel 触发，success / error） ─── */
    const EXECUTIONS = [
      {
        id: 'exec-1042', flowName: 'AI 科技日报', projectName: 'news-aggregator',
        trigger: 'schedule', status: 'success', startedAt: '2026-07-19 10:00:01', duration: '2m 14s',
        variables: { topic: 'AI 科技动态', trigger: 'schedule', scheduledAt: '2026-07-19T10:00:00+08:00', sourceCount: '5（登记内容源）' },

        nodes: [

          { name: 'fetch-save', nodeId: 'node-agent', status: 'success', fields: { type: 'agent (claude)', prompt: '抓取链接正文转 Markdown 并存入素材库', duration: '31s', skills: 'fetch-to-markdown' } },

          { time: '16:20:48', node: 'feishu-channel', message: '确认消息已回复（文字消息，含文件路径）；执行保持 success' },
        ],
        output: '速存成功：materials/2026-07-18-llm-agents-overview.md\n云文档同步失败（E-DOC-SYNC-FAILED）→ 已降级为飞书文字消息送达；文件落盘不受影响。',
        artifacts: [
          { name: '2026-07-18-llm-agents-overview.md', path: 'materials/2026-07-18-llm-agents-overview.md', kind: 'md', size: '12.8 KB', sync: { state: 'failed' } },
        ],
      },
    ];

    const state = { selectedId: 'exec-1042', tab: 'artifacts' };
    const TABS = [
      { key: 'nodes', label: '节点' },
      { key: 'logs', label: '日志' },
      { key: 'variables', label: '变量' },
      { key: 'output', label: '输出' },
      { key: 'artifacts', label: '产物', chip: true },
    ];

    /* ─── utils ─── */
    const $ = (sel) => document.querySelector(sel);
    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function toast(msg) {
      const root = $('#toastRoot');
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      root.appendChild(el);
      requestAnimationFrame(() => el.classList.add('show'));
      setTimeout(() => {
        el.classList.remove('show');
        setTimeout(() => el.remove(), 220);
      }, 2600);
    }

    /* ─── 执行列表 ─── */
    function renderExecRows() {
      $('#execRows').innerHTML = EXECUTIONS.map((ex) => `
        <div class="table-row${state.selectedId === ex.id ? ' active' : ''}" data-id="${esc(ex.id)}" role="button" tabindex="0">
          <div class="cell-main">
            <span class="cell-title">${esc(ex.flowName)}</span>
            <span class="cell-meta">${esc(ex.id)}</span>
          </div>
          <span class="cell-text">${esc(ex.projectName)}</span>
          <span class="cell-mono">${esc(ex.trigger)}</span>
          <span class="status status-${ex.status}"><span class="status-dot"></span>${ex.status}</span>
          <span class="cell-mono">${esc(ex.startedAt)}</span>
          <span class="cell-text">${esc(ex.duration)}</span>
        </div>`).join('');
    }

    /* ─── 详情面板 ─── */
    function current() {
      return EXECUTIONS.find((e) => e.id === state.selectedId);
    }

    function renderDetail() {
      const ex = current();
      const tabs = TABS.map((t) => `
        <button type="button" role="tab" aria-selected="${state.tab === t.key}"
          class="detail-tab${state.tab === t.key ? ' active' : ''}" data-tab="${t.key}">
          ${t.label}${t.chip ? '<span class="tab-chip">新</span>' : ''}
        </button>`).join('');

      $('#detailPanel').innerHTML = `
        <div class="detail-header">
          <div>
            <h2 class="detail-title">执行详情 #${esc(ex.id)}</h2>
            <div class="detail-subtitle">${esc(ex.flowName)} · ${esc(ex.projectName)} · trigger=${esc(ex.trigger)} · ${esc(ex.startedAt)}</div>
          </div>
          <div class="detail-status">
            <span class="detail-duration">用时 ${esc(ex.duration)}</span>
            <span class="status status-${ex.status}"><span class="status-dot"></span>${ex.status}</span>
          </div>
        </div>
        <div class="detail-tabs" role="tablist">${tabs}</div>
        <div class="detail-body" id="detailBody" role="tabpanel"></div>`;
      renderTabBody();
    }

    function renderTabBody() {
      const ex = current();
      const body = $('#detailBody');
      if (state.tab === 'nodes') {
        body.innerHTML = `<div class="execution-node-list">${ex.nodes.map((n) => `
          <div class="execution-node">
            <div class="execution-node-header">
              <span><span class="execution-node-name">${esc(n.name)}</span><span class="execution-node-id">${esc(n.nodeId)}</span></span>
              <span class="status status-${n.status === 'skipped' ? 'running' : n.status}"><span class="status-dot"></span>${esc(n.status)}</span>
            </div>
            <div class="execution-node-fields">
              ${Object.entries(n.fields).map(([k, v]) => `
                <span class="execution-node-field-label">${esc(k)}</span>
                <span class="execution-node-field-value">${esc(v)}</span>`).join('')}
            </div>
          </div>`).join('')}</div>`;
      } else if (state.tab === 'logs') {
        body.innerHTML = ex.logs.length
          ? ex.logs.map((l) => `
            <div class="log-entry">
              <span class="log-time">${esc(l.time)}</span>
              <span class="log-level${l.level === 'error' ? ' error' : ''}">${esc(l.node)}</span>
              <span class="log-msg${l.level === 'error' ? ' error' : ''}">${esc(l.message)}</span>
            </div>`).join('')
          : '<p class="detail-placeholder">暂无日志。</p>';
      } else if (state.tab === 'variables') {
        body.innerHTML = `<div class="kv-grid">
          ${Object.entries(ex.variables).map(([k, v]) => `
            <div class="kv-key">${esc(k)}</div><div class="kv-value">${esc(v)}</div>`).join('')}
        </div>`;
      } else if (state.tab === 'output') {
        body.innerHTML = `<pre class="output-box">${esc(ex.output)}</pre>`;
      } else if (state.tab === 'artifacts') {
        body.innerHTML = renderArtifacts(ex);
      }
    }

    /* ─── 产物 tab（本 story 新增，稳定块 8：执行记录关联产物文件路径列表） ─── */
    function renderArtifacts(ex) {
      if (!ex.artifacts.length) {
        return `
          <p class="detail-placeholder">本次执行未登记产物。</p>
          <p class="artifacts-note" style="text-align:center;">执行失败时半成品文件不登记为产物（PRD §8 E-AGENT-FAILED）。</p>`;
      }
      return `
        <div class="artifact-list">
          ${ex.artifacts.map((a, i) => `
            <div class="artifact-card">
              <div class="artifact-row">
                <span class="artifact-icon${a.kind === 'index' ? ' index' : ''}">${a.kind === 'index' ? 'IDX' : 'MD'}</span>
                <div class="artifact-main">
                  <div class="artifact-name-row">
                    <span class="artifact-name">${esc(a.name)}</span>
                    <span class="artifact-size">${esc(a.size)}</span>
                  </div>
                  <div class="artifact-path">${esc(a.path)}</div>
                </div>
                <div class="artifact-actions">
                  <button type="button" class="btn btn-secondary btn-sm" data-open="${i}">打开</button>
                  <button type="button" class="btn btn-ghost btn-sm" data-reveal="${i}">在文件夹中显示</button>
                </div>
              </div>
              ${renderSyncRow(a)}
            </div>`).join('')}
        </div>
        <p class="artifacts-note">产物以项目相对路径登记在执行记录中，CLI / API 可查（稳定块 8）。</p>`;
    }

    function renderSyncRow(a) {
      if (a.sync.state === 'synced') {
        return `
          <div class="sync-row">
            <span class="status-dot" style="background:var(--ch-success);"></span>
            <span>已同步飞书云文档</span>
            <a href="#" data-doc="${esc(a.sync.url)}">${esc(a.sync.url)} ↗</a>
          </div>`;
      }
      if (a.sync.state === 'failed') {
        return `
          <div class="sync-row sync-failed">
            <span class="status-dot" style="background:var(--ch-warning);"></span>
            <span><strong>云文档同步失败（E-DOC-SYNC-FAILED）。</strong>已降级为飞书文字消息送达（含文件路径）；文件落盘不受影响，执行保持 success。</span>
          </div>`;
      }
      return `
        <div class="sync-row">
          <span class="status-dot" style="background:var(--ch-text-tertiary);"></span>
          <span>${esc(a.sync.note || '未同步')}</span>
        </div>`;
    }

    /* ─── 交互 ─── */
    $('#execRows').addEventListener('click', (e) => {
      const row = e.target.closest('.table-row');
      if (!row) return;
      state.selectedId = row.dataset.id;
      // 默认 tab：成功执行落到「产物」，失败执行落到「日志」
      const ex = current();
      state.tab = ex.status === 'success' ? 'artifacts' : 'logs';
      renderExecRows();
      renderDetail();
    });

    $('#detailPanel').addEventListener('click', (e) => {
      const tab = e.target.closest('[data-tab]');
      if (tab) {
        state.tab = tab.dataset.tab;
        document.querySelectorAll('.detail-tab').forEach((t) => {
          const active = t.dataset.tab === state.tab;
          t.classList.toggle('active', active);
          t.setAttribute('aria-selected', String(active));
        });
        renderTabBody();
        return;
      }
      const openBtn = e.target.closest('[data-open]');
      if (openBtn) {
        const a = current().artifacts[Number(openBtn.dataset.open)];
        toast(`已调用系统默认应用打开 ${a.path}（演示）`);
        return;
      }
      const revealBtn = e.target.closest('[data-reveal]');
      if (revealBtn) {
        const a = current().artifacts[Number(revealBtn.dataset.reveal)];
        const dir = a.path.split('/').slice(0, -1).join('/');
        toast(`已在文件管理器中显示 ${dir}/（演示）`);
        return;
      }
      const docLink = e.target.closest('[data-doc]');
      if (docLink) {
        e.preventDefault();
        toast(`已在浏览器打开飞书云文档（演示链接）：${docLink.dataset.doc}`);
      }
    });

    renderExecRows();
    renderDetail();
  </script>
</body>
