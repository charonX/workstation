<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>内容源 · OPC Workstation</title>
  <link rel="stylesheet" href="_ds/global/tokens.css">
  <link rel="stylesheet" href="_ds/global/styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: var(--ch-font-sans);
      font-size: var(--ch-text-base);
      line-height: var(--ch-leading-normal);
      background: var(--ch-bg);
      color: var(--ch-text);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; border: 0; background: transparent; color: inherit; }

    /* ─── app shell ─── */
    .app-shell {
      display: grid;
      grid-template-columns: var(--ch-sidebar-width) 1fr;
      grid-template-rows: var(--ch-topbar-height) 1fr;
      height: 100vh;
      overflow: hidden;
    }
    .app-main { grid-row: 2; grid-column: 2; overflow: auto; padding: var(--ch-panel-padding); }

    /* ─── topbar ─── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      height: var(--ch-topbar-height); padding: 0 var(--ch-panel-padding);
      background: var(--ch-surface); border-bottom: 1px solid var(--ch-border);
      grid-row: 1; grid-column: 1 / -1; gap: var(--ch-space-4);
    }
    .topbar-left { display: flex; align-items: center; gap: var(--ch-space-4); flex: 1; min-width: 0; }
    .topbar-logo { font-weight: var(--ch-weight-bold); font-size: var(--ch-text-lg); letter-spacing: -0.02em; white-space: nowrap; }
    .topbar-search-form { max-width: 280px; width: 100%; }
    .topbar-search-input {
      width: 100%; padding: 6px 12px; background: var(--ch-surface-highest);
      border: 1px solid var(--ch-border); border-radius: var(--ch-radius-md);
      color: var(--ch-text); font-size: var(--ch-text-sm); outline: none; font-family: var(--ch-font-sans);
    }
    .topbar-search-input:focus { border-color: var(--ch-accent); }
    .topbar-right { display: flex; align-items: center; gap: var(--ch-space-3); flex-shrink: 0; }
    .icon-btn {
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--ch-border); border-radius: var(--ch-radius-md);
      background: transparent; color: var(--ch-text-secondary); transition: background 0.15s ease, color 0.15s ease;
    }
    .icon-btn:hover { background: var(--ch-surface-high); color: var(--ch-text); }

    /* ─── sidebar ─── */
    .sidebar {
      display: flex; flex-direction: column; background: var(--ch-surface);
      border-right: 1px solid var(--ch-border); grid-row: 2; grid-column: 1; overflow: hidden;
    }
    .sidebar-nav { flex: 1; overflow: auto; display: flex; flex-direction: column; padding: var(--ch-space-2); gap: var(--ch-space-1); }
    .nav-group { margin-bottom: var(--ch-space-4); }
    .nav-label {
      font-size: var(--ch-text-xs); font-weight: var(--ch-weight-medium); color: var(--ch-text-tertiary);
      text-transform: uppercase; letter-spacing: 0.05em; padding: 0 var(--ch-space-3); margin-bottom: var(--ch-space-2);
    }
    .nav-link {
      display: flex; align-items: center; gap: var(--ch-space-2);
      padding: var(--ch-space-2) var(--ch-space-3); color: var(--ch-text-secondary);
      border-radius: var(--ch-radius-md); font-size: var(--ch-text-base); font-weight: var(--ch-weight-medium);
      transition: background 0.15s ease, color 0.15s ease;
    }
    .nav-link:hover { background: var(--ch-surface-high); color: var(--ch-text); }
    .nav-link.active { background: var(--ch-accent-soft); color: var(--ch-accent); }
    .sidebar-bottom { border-top: 1px solid var(--ch-border); padding: var(--ch-space-2); }
    .nav-badge {
      margin-left: auto; background: var(--ch-error); color: #fff;
      border-radius: var(--ch-radius-full); font-size: 10px; font-weight: var(--ch-weight-bold);
      min-width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; padding: 0 5px;
    }

    /* ─── page ─── */
    .page { max-width: 1200px; }
    .page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: var(--ch-space-6); gap: var(--ch-space-4); }
    .page-title { font-size: var(--ch-text-xl); font-weight: var(--ch-weight-semibold); margin: 0; }
    .page-subtitle { color: var(--ch-text-secondary); font-size: var(--ch-text-sm); margin: 2px 0 0; }

    /* ─── card ─── */
    .card { background: var(--ch-surface); border: 1px solid var(--ch-border); border-radius: var(--ch-radius-lg); overflow: hidden; margin-bottom: var(--ch-space-4); }
    .card-header { padding: var(--ch-space-3) var(--ch-space-4); border-bottom: 1px solid var(--ch-border); display: flex; align-items: center; justify-content: space-between; }
    .card-title { font-size: var(--ch-text-md); font-weight: var(--ch-weight-semibold); margin: 0 0 2px; }
    .card-subtitle { font-size: var(--ch-text-xs); color: var(--ch-text-secondary); margin: 0; }
    .card-body { padding: var(--ch-space-4); }

    /* ─── buttons ─── */
    .btn {
      display: inline-flex; align-items: center; gap: var(--ch-space-2);
      padding: 6px 14px; border-radius: var(--ch-radius-md); font-weight: var(--ch-weight-semibold);
      font-size: var(--ch-text-sm); border: 1px solid transparent; transition: opacity 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-primary { background: var(--ch-accent); color: var(--ch-accent-text); }
    .btn-primary:hover:not(:disabled) { background: var(--ch-accent-dim); }
    .btn-secondary { background: transparent; border-color: var(--ch-border); color: var(--ch-text); }
    .btn-secondary:hover:not(:disabled) { border-color: var(--ch-border-strong); background: var(--ch-surface-high); }
    .btn-danger { background: var(--ch-error); color: #fff; }
    .btn-sm { padding: 4px 10px; font-size: var(--ch-text-xs); }
    .action-link { color: var(--ch-accent); font-size: var(--ch-text-sm); font-weight: var(--ch-weight-medium); padding: 0; }
    .action-link:hover { text-decoration: underline; }
    .action-link.danger { color: var(--ch-error); }

    /* ─── source table ─── */
    .source-head, .source-row {
      display: grid;
      grid-template-columns: minmax(150px, 1.2fr) 96px minmax(160px, 1.5fr) minmax(140px, 1.2fr) 108px 110px;
      gap: var(--ch-space-3); align-items: center; padding: var(--ch-space-3) var(--ch-space-4);
    }
    .source-head {
      padding: var(--ch-space-2) var(--ch-space-4); background: var(--ch-surface-high);
      border-bottom: 1px solid var(--ch-border); font-size: var(--ch-text-xs); font-weight: var(--ch-weight-medium);
      color: var(--ch-text-secondary); text-transform: uppercase; letter-spacing: 0.05em;
    }
    .source-row { border-bottom: 1px solid var(--ch-border); font-size: var(--ch-text-sm); transition: background 0.15s ease; }
    .source-row:last-child { border-bottom: none; }
    .source-row:hover { background: var(--ch-surface-high); }
    .source-row.disabled .cell-title, .source-row.disabled .config-cell { color: var(--ch-text-tertiary); }
    .cell-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .cell-title { font-weight: var(--ch-weight-medium); color: var(--ch-text); }
    .cell-meta { font-size: var(--ch-text-xs); color: var(--ch-text-tertiary); font-family: var(--ch-font-mono); }
    .config-cell { font-family: var(--ch-font-mono); font-size: var(--ch-text-xs); color: var(--ch-text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cell-dim { color: var(--ch-text-tertiary); font-size: var(--ch-text-xs); }
    .status-cell { display: flex; align-items: center; gap: var(--ch-space-2); }
    .action-cell { display: flex; align-items: center; gap: var(--ch-space-3); justify-content: flex-end; }
    .table-empty { padding: var(--ch-space-8) var(--ch-space-4); text-align: center; color: var(--ch-text-secondary); font-size: var(--ch-text-sm); }

    /* ─── tag chips ─── */
    .tag-list { display: flex; flex-wrap: wrap; gap: 4px; }
    .tag-chip {
      display: inline-flex; align-items: center; padding: 1px 8px; border-radius: var(--ch-radius-full);
      background: var(--ch-surface-highest); border: 1px solid var(--ch-border);
      color: var(--ch-text-secondary); font-size: var(--ch-text-xs); font-weight: var(--ch-weight-medium);
      white-space: nowrap;
    }
    .tag-chip.removable { padding-right: 4px; }
    .tag-remove {
      display: inline-flex; align-items: center; justify-content: center;
      width: 16px; height: 16px; border-radius: 50%; color: var(--ch-text-tertiary);
      font-size: 12px; line-height: 1; margin-left: 2px; padding: 0;
    }
    .tag-remove:hover { color: var(--ch-error); background: var(--ch-error-soft); }

    /* ─── type badges ─── */
    .badge {
      display: inline-flex; align-items: center; padding: 1px 8px; border-radius: var(--ch-radius-full);
      font-size: var(--ch-text-xs); font-weight: var(--ch-weight-medium); font-family: var(--ch-font-mono);
    }
    .badge-webpage { background: var(--ch-info-soft); color: var(--ch-info); }
    .badge-rss { background: var(--ch-warning-soft); color: var(--ch-warning); }
    .badge-x { background: transparent; border: 1px solid var(--ch-codex); color: var(--ch-codex); }
    .badge-wechat { background: var(--ch-success-soft); color: var(--ch-success); }

    /* ─── toggle switch ─── */
    .switch {
      position: relative; width: 32px; height: 18px; border-radius: var(--ch-radius-full); flex-shrink: 0;
      background: var(--ch-surface-highest); border: 1px solid var(--ch-border-strong);
      transition: background 0.15s ease, border-color 0.15s ease; padding: 0;
    }
    .switch::after {
      content: ''; position: absolute; top: 1px; left: 1px; width: 14px; height: 14px; border-radius: 50%;
      background: var(--ch-text-tertiary); transition: left 0.15s ease, background 0.15s ease;
    }
    .switch.on { background: var(--ch-accent); border-color: var(--ch-accent); }
    .switch.on::after { left: 15px; background: var(--ch-accent-text); }

    /* ─── modal ─── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); display: none;
      align-items: center; justify-content: center; z-index: 1000; padding: var(--ch-space-4);
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--ch-surface); border: 1px solid var(--ch-border); border-radius: var(--ch-radius-lg);
      width: 100%; max-width: 640px; max-height: 80vh; overflow: hidden; display: flex; flex-direction: column;
      box-shadow: var(--ch-shadow-lg);
    }
    .modal--sm { max-width: 400px; }
    .modal--md { max-width: 520px; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: var(--ch-space-4); border-bottom: 1px solid var(--ch-border); }
    .modal-title { font-size: var(--ch-text-lg); font-weight: var(--ch-weight-semibold); margin: 0; }
    .modal-close { color: var(--ch-text-tertiary); font-size: var(--ch-text-lg); line-height: 1; padding: 2px 6px; border-radius: var(--ch-radius-sm); }
    .modal-close:hover { background: var(--ch-surface-high); color: var(--ch-text); }
    .modal-body { padding: var(--ch-space-4); overflow-y: auto; flex: 1; }
    .modal-footer { display: flex; align-items: center; justify-content: flex-end; gap: var(--ch-space-3); padding: var(--ch-space-3) var(--ch-space-4); border-top: 1px solid var(--ch-border); }

    /* ─── form ─── */
    .form-group { margin-bottom: var(--ch-space-5); }
    .form-group:last-child { margin-bottom: 0; }
    .form-label {
      display: block; font-size: var(--ch-text-xs); font-weight: var(--ch-weight-medium); color: var(--ch-text-secondary);
      margin-bottom: var(--ch-space-2); text-transform: uppercase; letter-spacing: 0.05em;
    }
    .form-input {
      width: 100%; padding: 8px 12px; background: var(--ch-surface-highest); border: 1px solid var(--ch-border);
      border-radius: var(--ch-radius-md); color: var(--ch-text); font-size: var(--ch-text-sm); outline: none; font-family: var(--ch-font-mono);
    }
    .form-input:focus { border-color: var(--ch-accent); }
    .form-input.invalid { border-color: var(--ch-error); }
    .help-text { font-size: var(--ch-text-xs); color: var(--ch-text-tertiary); margin-top: var(--ch-space-2); margin-bottom: 0; }
    .field-error { display: none; color: var(--ch-error); font-size: var(--ch-text-xs); margin-top: var(--ch-space-1); }
    .field-error.show { display: block; }

    /* ─── tag editor（模态框内） ─── */
    .tag-input-row { display: flex; gap: var(--ch-space-2); }
    .tag-input-row .form-input { flex: 1; }
    .tag-input-row .btn { flex-shrink: 0; }
    .tag-chips { display: flex; flex-wrap: wrap; gap: var(--ch-space-2); margin-top: var(--ch-space-2); }
    .tag-chips:empty { margin-top: 0; }

    /* ─── type radio cards ─── */
    .type-options { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--ch-space-2); }
    .type-option {
      border: 1px solid var(--ch-border); border-radius: var(--ch-radius-md); background: var(--ch-surface);
      padding: var(--ch-space-2) var(--ch-space-1); text-align: center; transition: border-color 0.15s ease, background 0.15s ease;
    }
    .type-option:hover { border-color: var(--ch-border-strong); }
    .type-option.selected { border-color: var(--ch-accent); background: var(--ch-accent-soft); }
    .type-option .badge { margin-bottom: 4px; }
    .type-option-desc { display: block; font-size: 10px; color: var(--ch-text-tertiary); }

    /* ─── modal text ─── */
    .modal-text { font-size: var(--ch-text-sm); color: var(--ch-text-secondary); margin: 0; }

    /* ─── toast ─── */
    .toast-root { position: fixed; right: var(--ch-space-5); bottom: var(--ch-space-5); z-index: 2000; display: flex; flex-direction: column; gap: var(--ch-space-2); }
    .toast {
      background: var(--ch-surface-highest); border: 1px solid var(--ch-border-strong); border-radius: var(--ch-radius-md);
      box-shadow: var(--ch-shadow-md); padding: var(--ch-space-2) var(--ch-space-4); font-size: var(--ch-text-sm); color: var(--ch-text);
      opacity: 0; transform: translateY(6px); transition: opacity 0.2s ease, transform 0.2s ease; max-width: 420px;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-left">
        <div class="topbar-logo">OPC Workstation</div>
        <form class="topbar-search-form" onsubmit="return false;">
          <input type="search" class="topbar-search-input" placeholder="搜索项目、流程、执行…" aria-label="搜索" />

          <a class="nav-link" href="#">工作区</a>

          </div>

  <!-- 新建/编辑模态框 -->
  <div class="modal-overlay" id="formOverlay">
    <div class="modal modal--md" role="dialog" aria-modal="true" aria-labelledby="formModalTitle">
      <div class="modal-header">
        <h2 class="modal-title" id="formModalTitle">新建内容源</h2>
        <button type="button" class="modal-close" data-close="form" aria-label="关闭">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="fName">名称</label>
          <input class="form-input" id="fName" maxlength="64" placeholder="例如：Hacker News" autocomplete="off" />
          <div class="field-error" id="errName"></div>
        </div>
        <div class="form-group">
          <label class="form-label">类型</label>
          <div class="type-options" id="typeOptions"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="fTagInput">品类标签</label>
          <div class="tag-input-row">
            <input class="form-input" id="fTagInput" maxlength="32" placeholder="输入标签，回车添加（如：AI）" autocomplete="off" />
            <button type="button" class="btn btn-secondary" id="addTagBtn">添加</button>
          </div>
          <div class="tag-chips" id="tagChips"></div>
          <div class="field-error" id="errTags"></div>
          <p class="help-text">至少 1 个。flow 按 tag 筛选引用内容源（如 tag=AI 的全部启用源），不逐一关联。</p>
        </div>
        <div class="form-group">
          <label class="form-label" for="fConfig" id="configLabel">页面 URL</label>
          <input class="form-input" id="fConfig" placeholder="https://example.com/page" autocomplete="off" />
          <div class="field-error" id="errConfig"></div>
          <p class="help-text" id="configHelp"></p>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-close="form">取消</button>
        <button type="button" class="btn btn-primary" id="saveSourceBtn">创建</button>
      </div>
    </div>
  </div>

  <!-- 删除确认模态框 -->
  <div class="modal-overlay" id="deleteOverlay">
    <div class="modal modal--sm" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle">
      <div class="modal-header">
        <h2 class="modal-title" id="deleteModalTitle">删除内容源</h2>
        <button type="button" class="modal-close" data-close="delete" aria-label="关闭">×</button>
      </div>
      <div class="modal-body" id="deleteBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-close="delete">取消</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">删除</button>
      </div>
    </div>
  </div>

  <div class="toast-root" id="toastRoot"></div>

  <script src="_ds/global/_ds_bundle.js"></script>
  <script>
    'use strict';

    /* ─── mock 数据（对应 PRD §4 稳定块 3：内容源一级实体，含 tags 品类标签） ─── */
    const TYPE_META = {
      webpage: { label: '网页',   badge: 'badge-webpage', configLabel: '页面 URL',  placeholder: 'https://example.com/page',   help: '抓取该网页正文并转为 Markdown。', kind: 'url',     desc: '单页抓取' },
      rss:     { label: 'RSS',    badge: 'badge-rss',     configLabel: 'Feed URL',  placeholder: 'https://example.com/feed.xml', help: '订阅 RSS / Atom 源的最新条目。', kind: 'url',     desc: '订阅源' },
      x:       { label: 'X',      badge: 'badge-x',       configLabel: 'X 账号',    placeholder: '@username',                  help: '尽力抓取该账号时间线，质量不保障。', kind: 'account', desc: '账号时间线' },
      wechat:  { label: '公众号', badge: 'badge-wechat',  configLabel: '公众号标识', placeholder: '@公众号名称或 ID',            help: '尽力抓取公众号推文，质量不保障。', kind: 'account', desc: '公众号推文' },
    };
    const TYPE_ORDER = ['webpage', 'rss', 'x', 'wechat'];

    const state = {
      sources: [
        { id: 'src-hn',      name: 'Hacker News',        type: 'webpage', config: 'https://news.ycombinator.com',             enabled: true,  tags: ['科技', '新闻'] },
        { id: 'src-sspai',   name: '少数派',              type: 'rss',     config: 'https://sspai.com/feed',                   enabled: true,  tags: ['效率', '数码'] },
        { id: 'src-qbit',    name: '量子位公众号',        type: 'wechat',  config: '@QbitAI',                                  enabled: true,  tags: ['AI', '资讯'] },
        { id: 'src-ruanyf',  name: '阮一峰的网络日志',    type: 'rss',     config: 'https://www.ruanyifeng.com/blog/atom.xml', enabled: true,  tags: ['技术', '随笔'] },
        { id: 'src-karpathy', name: 'Karpathy 的 X',     type: 'x',       config: '@karpathy',                                enabled: false, tags: ['AI', '观点'] },
      ],
      editingId: null,
      deletingId: null,
      selectedType: 'webpage',
      editingTags: [],
    };

    /* ─── utils ─── */
    const $ = (sel) => document.querySelector(sel);
    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function toast(msg) {
      const root = $('#toastRoot');
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      root.appendChild(el);
      requestAnimationFrame(() => el.classList.add('show'));
      setTimeout(() => {
        el.classList.remove('show');
        setTimeout(() => el.remove(), 220);
      }, 2600);
    }
    function isValidHttpUrl(v) {
      if (!/^https?:\/\//i.test(v)) return false;
      try { new URL(v); return true; } catch { return false; }
    }

    /* ─── 列表渲染 ─── */
    function renderList() {
      const rows = $('#sourceRows');
      const enabledCount = state.sources.filter((s) => s.enabled).length;
      $('#listMeta').textContent = `共 ${state.sources.length} 个来源 · ${enabledCount} 个启用`;

      if (state.sources.length === 0) {
        rows.innerHTML = '<div class="table-empty">暂无内容源。点击右上角「新建内容源」，登记第一个收集来源。</div>';
        return;
      }

      rows.innerHTML = state.sources.map((s) => {
        const meta = TYPE_META[s.type];
        const tags = s.tags.length
          ? `<span class="tag-list">${s.tags.map((t) => `<span class="tag-chip">${esc(t)}</span>`).join('')}</span>`
          : '<span class="cell-dim">无标签</span>';
        return `
          <div class="source-row${s.enabled ? '' : ' disabled'}" data-id="${esc(s.id)}">
            <div class="cell-main">
              <span class="cell-title">${esc(s.name)}</span>
              <span class="cell-meta">${esc(s.id)}</span>
            </div>
            <span><span class="badge ${meta.badge}">${meta.label}</span></span>
            <span class="config-cell" title="${esc(s.config)}">${esc(s.config)}</span>
            <span>${tags}</span>
            <span class="status-cell">
              <button type="button" class="switch${s.enabled ? ' on' : ''}" role="switch" aria-checked="${s.enabled}"
                      title="${s.enabled ? '点击停用' : '点击启用'}" data-action="toggle" data-id="${esc(s.id)}"></button>
              <span class="cell-dim">${s.enabled ? '启用中' : '已停用'}</span>
            </span>
            <span class="action-cell">
              <button type="button" class="action-link" data-action="edit" data-id="${esc(s.id)}">编辑</button>
              <button type="button" class="action-link danger" data-action="delete" data-id="${esc(s.id)}">删除</button>
            </span>
          </div>`;
      }).join('');
    }

    /* ─── 新建 / 编辑模态框 ─── */
    function renderTypeOptions() {
      $('#typeOptions').innerHTML = TYPE_ORDER.map((t) => {
        const meta = TYPE_META[t];
        return `
          <button type="button" class="type-option${state.selectedType === t ? ' selected' : ''}" data-type="${t}">
            <span class="badge ${meta.badge}">${meta.label}</span>
            <span class="type-option-desc">${meta.desc}</span>
          </button>`;
      }).join('');
    }

    function syncConfigField() {
      const meta = TYPE_META[state.selectedType];
      $('#configLabel').textContent = meta.configLabel;
      $('#fConfig').placeholder = meta.placeholder;
      $('#configHelp').textContent = meta.help;
    }

    /* ─── 品类标签编辑器 ─── */
    function renderTagChips() {
      $('#tagChips').innerHTML = state.editingTags.map((t, i) => `
        <span class="tag-chip removable">${esc(t)}
          <button type="button" class="tag-remove" data-remove-tag="${i}" aria-label="删除标签 ${esc(t)}">×</button>
        </span>`).join('');
    }

    function showTagError(msg) {
      const err = $('#errTags');
      err.textContent = msg;
      err.classList.add('show');
    }

    function addTagFromInput() {
      const input = $('#fTagInput');
      const v = input.value.trim();
      $('#errTags').classList.remove('show');
      if (!v) return;
      if (v.length > 16) { showTagError('每个标签不超过 16 字符'); return; }
      if (state.editingTags.includes(v)) { showTagError('标签已存在'); input.select(); return; }
      state.editingTags.push(v);
      input.value = '';
      renderTagChips();
      input.focus();
    }

    function clearErrors() {
      for (const id of ['errName', 'errConfig', 'errTags']) {
        const el = $('#' + id);
        el.textContent = '';
        el.classList.remove('show');
      }
      $('#fName').classList.remove('invalid');
      $('#fConfig').classList.remove('invalid');
    }

    function showError(field, msg) {
      const errEl = $(field === 'name' ? '#errName' : '#errConfig');
      const inputEl = $(field === 'name' ? '#fName' : '#fConfig');
      errEl.textContent = msg;
      errEl.classList.add('show');
      inputEl.classList.add('invalid');
    }

    function openFormModal(editingId) {
      state.editingId = editingId || null;
      clearErrors();
      if (editingId) {
        const s = state.sources.find((x) => x.id === editingId);
        if (!s) return;
        $('#formModalTitle').textContent = '编辑内容源';
        $('#saveSourceBtn').textContent = '保存';
        $('#fName').value = s.name;
        $('#fConfig').value = s.config;
        state.selectedType = s.type;
        state.editingTags = [...s.tags];
      } else {
        $('#formModalTitle').textContent = '新建内容源';
        $('#saveSourceBtn').textContent = '创建';
        $('#fName').value = '';
        $('#fConfig').value = '';
        state.selectedType = 'webpage';
        state.editingTags = [];
      }
      $('#fTagInput').value = '';
      renderTagChips();
      renderTypeOptions();
      syncConfigField();
      $('#formOverlay').classList.add('open');
      setTimeout(() => $('#fName').focus(), 50);
    }

    function closeOverlays() {
      $('#formOverlay').classList.remove('open');
      $('#deleteOverlay').classList.remove('open');
    }

    /* 校验规则与 PRD §7 一致（UI 与 CLI/API 同规则，前端即时提示） */
    function validate() {
      clearErrors();
      const name = $('#fName').value.trim();
      const config = $('#fConfig').value.trim();
      const meta = TYPE_META[state.selectedType];
      let ok = true;

      if (!name || name.length > 64) {
        showError('name', '名称必填且不超过 64 字符');
        ok = false;
      } else if (state.sources.some((s) => s.name === name && s.id !== state.editingId)) {
        showError('name', '已存在同名内容源');
        ok = false;
      }

      if (state.editingTags.length === 0) {
        showTagError('请至少添加一个品类标签');
        ok = false;
      }

      if (meta.kind === 'url') {
        if (!isValidHttpUrl(config)) {
          showError('config', '请提供合法 URL');
          ok = false;
        }
      } else if (!config) {
        showError('config', '请提供账号标识');
        ok = false;
      }
      return ok ? { name, config, tags: [...state.editingTags] } : null;
    }

    function saveSource() {
      const values = validate();
      if (!values) return;
      if (state.editingId) {
        const s = state.sources.find((x) => x.id === state.editingId);
        Object.assign(s, { name: values.name, type: state.selectedType, config: values.config, tags: values.tags });
        toast(`内容源「${values.name}」已保存`);
      } else {
        const id = 'src-' + Math.random().toString(36).slice(2, 8);
        state.sources.push({ id, name: values.name, type: state.selectedType, config: values.config, tags: values.tags, enabled: true });
        toast(`内容源「${values.name}」已创建`);
      }
      closeOverlays();
      renderList();
    }

    /* ─── 删除确认（tag 筛选关联后无"被引用"警告，普通确认即可） ─── */
    function openDeleteModal(id) {
      const s = state.sources.find((x) => x.id === id);
      if (!s) return;
      state.deletingId = id;
      $('#deleteBody').innerHTML = `
        <p class="modal-text">确定删除内容源「${esc(s.name)}」吗？此操作不可撤销；按 tag 引用该来源的 flow 下次执行时将自然少一个来源。</p>`;
      $('#confirmDeleteBtn').textContent = '删除';
      $('#deleteOverlay').classList.add('open');
    }

    function confirmDelete() {
      const idx = state.sources.findIndex((x) => x.id === state.deletingId);
      if (idx >= 0) {
        const [removed] = state.sources.splice(idx, 1);
        toast(`内容源「${removed.name}」已删除`);
      }
      state.deletingId = null;
      closeOverlays();
      renderList();
    }

    /* ─── 启停切换 ─── */
    function toggleSource(id) {
      const s = state.sources.find((x) => x.id === id);
      if (!s) return;
      s.enabled = !s.enabled;
      renderList();
      toast(s.enabled ? `已启用「${s.name}」` : `已停用「${s.name}」——按 tag 筛选时将跳过该来源`);
    }

    /* ─── 事件绑定 ─── */
    $('#createBtn').addEventListener('click', () => openFormModal(null));
    $('#saveSourceBtn').addEventListener('click', saveSource);
    $('#confirmDeleteBtn').addEventListener('click', confirmDelete);

    $('#sourceRows').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const { action, id } = btn.dataset;
      if (action === 'toggle') toggleSource(id);
      else if (action === 'edit') openFormModal(id);
      else if (action === 'delete') openDeleteModal(id);
    });

    $('#typeOptions').addEventListener('click', (e) => {
      const opt = e.target.closest('[data-type]');
      if (!opt) return;
      state.selectedType = opt.dataset.type;
      renderTypeOptions();
      syncConfigField();
      $('#fConfig').classList.remove('invalid');
      $('#errConfig').classList.remove('show');
    });

    $('#addTagBtn').addEventListener('click', addTagFromInput);
    $('#fTagInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        e.stopPropagation();
        addTagFromInput();
      }
    });
    $('#fTagInput').addEventListener('input', () => { $('#errTags').classList.remove('show'); });
    $('#tagChips').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-remove-tag]');
      if (!btn) return;
      state.editingTags.splice(Number(btn.dataset.removeTag), 1);
      renderTagChips();
    });

    document.querySelectorAll('[data-close]').forEach((el) => {
      el.addEventListener('click', closeOverlays);
    });
    document.querySelectorAll('.modal-overlay').forEach((overlay) => {
      overlay.addEventListener('click', (e) => { if (e.target === overlay) closeOverlays(); });
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeOverlays();
      if (e.key === 'Enter' && $('#formOverlay').classList.contains('open')
          && e.target.classList.contains('form-input') && e.target.id !== 'fTagInput') {
        saveSource();
      }
    });
    $('#fName').addEventListener('input', () => { $('#fName').classList.remove('invalid'); $('#errName').classList.remove('show'); });
    $('#fConfig').addEventListener('input', () => { $('#fConfig').classList.remove('invalid'); $('#errConfig').classList.remove('show'); });

    renderList();
  </script>
</body>
</html>
