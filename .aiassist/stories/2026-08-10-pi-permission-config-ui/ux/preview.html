<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ux — Design system</title>
<style>

:root {
  color-scheme: light;
  --ds-bg: #FAF9F5;
  --ds-surface: #FFFFFF;
  --ds-text: rgba(15, 12, 8, 0.92);
  --ds-text-2: rgba(15, 12, 8, 0.62);
  --ds-text-3: rgba(15, 12, 8, 0.46);
  --ds-border: rgba(15, 12, 8, 0.10);
  --ds-border-soft: rgba(15, 12, 8, 0.07);
  --ds-hover: rgba(15, 12, 8, 0.045);
  --ds-active: rgba(15, 12, 8, 0.07);
  --ds-accent: #D97757;
  --ds-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --ds-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--ds-font);
  background: var(--ds-bg);
  color: var(--ds-text);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

.ds-pane { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

/* ------------------------------------------------- outline (left nav) */
.ds-outline {
  flex: 0 0 248px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--ds-border-soft);
  background: var(--ds-bg);
}
@media (max-width: 1007px) { .ds-outline { display: none; } }
.ds-outline-head { padding: 18px 16px 12px; }
.ds-outline-head h1 { margin: 0; font-size: 18px; font-weight: 550; letter-spacing: -0.01em; color: var(--ds-text); }
.ds-outline-scroll { flex: 1; overflow-y: auto; padding: 4px 8px 16px; scrollbar-width: thin; }
.ds-pinned { margin: 0 0 4px; padding: 0 0 6px; border-bottom: 1px solid var(--ds-border-soft); }
.ds-item {
  display: flex; align-items: center; width: 100%;
  text-align: left; padding: 5px 8px 5px 24px;
  font-size: 12px; line-height: 1.35; color: var(--ds-text-2);
  border-radius: 6px;
}
.ds-item:hover { background: var(--ds-hover); color: var(--ds-text); }
.ds-item.active { font-weight: 550; color: var(--ds-text); background: var(--ds-active); }
.ds-item .ds-ic { flex: 0 0 auto; width: 13px; height: 13px; margin-left: -19px; margin-right: 6px; opacity: 0.75; }
.ds-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ds-group-btn {
  display: flex; align-items: center; gap: 5px; width: 100%;
  padding: 6px 8px; margin-top: 6px;
  font-size: 12px; font-weight: 550; color: var(--ds-text-2);
  border-radius: 6px;
}
.ds-group-btn:hover { background: var(--ds-hover); color: var(--ds-text); }
.ds-group-btn .ds-caret { width: 9px; height: 9px; flex: 0 0 auto; transition: transform 0.15s ease; opacity: 0.7; }
.ds-outline-group.collapsed .ds-caret { transform: rotate(-90deg); }
.ds-outline-group.collapsed .ds-group-items { display: none; }
.ds-group-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ------------------------------------------------------- content column */
.ds-content { flex: 1 1 auto; min-width: 0; overflow-y: auto; overscroll-behavior: contain; }
.ds-content-inner {
  display: flex; flex-direction: column; gap: 24px;
  padding: 30px 16px 80px;
  max-width: 760px; margin: 0 auto;
}
.ds-group-label { margin: 6px 0 14px; font-size: 13px; font-weight: 550; color: var(--ds-text); }
.ds-card + .ds-card { margin-top: 26px; }
.ds-card-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
.ds-card-title { margin: 0; font-size: 13.5px; font-weight: 550; line-height: 1.3; color: var(--ds-text); }
.ds-card-sub { margin: 2px 0 0; font-size: 12px; line-height: 1.45; color: var(--ds-text-3); }
.ds-prevwrap {
  position: relative; overflow: hidden;
  border: 1px solid var(--ds-border-soft); border-radius: 8px;
  background: #fff;
}
/* Outer-tree color-scheme on the shadow host beats the card's own
   ':host { color-scheme: light dark }' (rewritten from ':root'), so
   light-dark() tokens resolve LIGHT regardless of the viewer's OS theme —
   the preview chrome is light-only. Cards opting into dark explicitly
   (e.g. a '.spectrum-dark' subtree) still render dark. */
.ds-stage { transform-origin: top left; visibility: hidden; color-scheme: light; }
.ds-stage[data-ready] { visibility: visible; }

/* ------------------------------------------------------------- readme */
.ds-readme-body { position: relative; }
.ds-readme-body.collapsed { max-height: 280px; overflow: hidden; }
.ds-readme-body.collapsed::after {
  content: ""; position: absolute; inset: auto 0 0 0; height: 64px;
  background: linear-gradient(to bottom, rgba(250, 249, 245, 0), var(--ds-bg));
  pointer-events: none;
}
.ds-readme-toggle { margin-top: 8px; font-size: 12px; font-weight: 500; color: var(--ds-text-2); }
.ds-readme-toggle:hover { color: var(--ds-text); }

/* -------------------------------------------------------------- prose */
.ds-prose { font-size: 13px; line-height: 1.6; color: var(--ds-text); }
.ds-prose > :first-child { margin-top: 0; }
.ds-prose h1 { font-size: 19px; font-weight: 600; margin: 22px 0 8px; letter-spacing: -0.01em; }
.ds-prose h2 { font-size: 16px; font-weight: 600; margin: 20px 0 6px; }
.ds-prose h3 { font-size: 13.5px; font-weight: 600; margin: 16px 0 4px; }
.ds-prose h4, .ds-prose h5, .ds-prose h6 { font-size: 12.5px; font-weight: 600; margin: 14px 0 4px; }
.ds-prose p { margin: 0 0 10px; }
.ds-prose ul, .ds-prose ol { margin: 0 0 10px; padding-left: 22px; }
.ds-prose li { margin: 2px 0; }
.ds-prose code {
  font-family: var(--ds-mono); font-size: 0.92em;
  background: rgba(15, 12, 8, 0.055); border-radius: 4px; padding: 0.1em 0.35em;
}
.ds-prose pre {
  background: rgba(15, 12, 8, 0.045); border: 1px solid var(--ds-border-soft);
  border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: 0 0 12px;
}
.ds-prose pre code { background: none; padding: 0; font-size: 11.5px; line-height: 1.55; }
.ds-prose blockquote {
  margin: 0 0 10px; padding: 2px 0 2px 12px;
  border-left: 3px solid rgba(15, 12, 8, 0.14); color: var(--ds-text-2);
}
.ds-prose hr { border: 0; border-top: 1px solid var(--ds-border-soft); margin: 16px 0; }
.ds-prose table { border-collapse: collapse; margin: 0 0 12px; font-size: 12px; width: 100%; }
.ds-prose th, .ds-prose td { border: 1px solid var(--ds-border); padding: 5px 9px; text-align: left; vertical-align: top; }
.ds-prose th { background: rgba(15, 12, 8, 0.035); font-weight: 600; }
.ds-prose img { max-width: 100%; border-radius: 6px; }
.ds-prose a { color: inherit; text-decoration: underline; text-decoration-color: rgba(15, 12, 8, 0.3); }
.ds-prose a:hover { text-decoration-color: currentColor; }

.ds-empty { font-size: 13px; color: var(--ds-text-3); padding: 24px 0; }

</style>

</head>
<body>
<div class="ds-pane">
<nav class="ds-outline" aria-label="Design system outline"><div class="ds-outline-head"><h1>Design system</h1></div><div class="ds-outline-scroll"><div class="ds-outline-group"><button class="ds-group-btn" data-group-toggle><svg class="ds-caret" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1.5 3.25 5 6.75l3.5-3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>project-detail</span></button><div class="ds-group-items"><button class="ds-item" data-target="g-project-detail"><span>permission-config</span></button></div></div></div></nav>
<main class="ds-content" data-scroll>
<div class="ds-content-inner">
<div class="ds-group" id="g-project-detail" data-anchor data-anchor-key="g-project-detail"><h2 class="ds-group-label">project-detail</h2><section class="ds-card" id="card-0-permission-config" data-card data-anchor data-anchor-key="g-project-detail"><header class="ds-card-head"><div><h3 class="ds-card-title">permission-config</h3></div></header><div class="ds-prevwrap" data-fit style="box-sizing:content-box;width:728px;height:565px;"><div class="ds-stage" data-stage style="width:980px;height:760px;transform:scale(0.7428571428571429);"><template shadowrootmode="open"><div class="__dsroot" style="margin:0;width:100%;height:100%;overflow:auto;box-sizing:border-box;"><div class="stage">
  <div class="stage-note">UX 原型 · 项目详情弹窗「权限配置」页签 · 交互：模式切换 / allow-ask / 增删 path / 保存校验 / 空态↔已配置</div>

  <div class="modal">
    <div class="modal-head">
      <span class="modal-title">日报模板项目 <span class="modal-sub">· /Users/zhanglei/workspace/daily-report</span></span>
      <button class="modal-close">✕</button>
    </div>
    <div class="tabs">
      <button class="tab">技能</button>
      <button class="tab active">权限配置</button>
      <button class="tab dim">…</button>
    </div>

    <div class="perm-body">
      <!-- 顶栏：模式切换 + 保存 -->
      <div class="perm-toolbar">
        <div class="mode-switch">
          <button class="mode-btn active" data-mode="vis">可视化</button>
          <button class="mode-btn" data-mode="json">JSON</button>
        </div>
        <span class="dirty-hint" id="dirtyHint" hidden>● 有未保存的更改</span>
        <span class="saved-hint" id="savedHint" hidden>✓ 已保存，规则已生效</span>
        <span class="toolbar-spacer"></span>
        <button class="save-btn" id="saveBtn">保存</button>
      </div>

      <!-- 校验错误条 -->
      <div class="error-banner" id="errorBanner">
        <span>保存被拦截：</span><span id="errorMsg"></span>
      </div>

      <!-- ============ 可视化模式 ============ -->
      <div class="vis-mode">
        <!-- 空态（无 .pi 文件时） -->
        <div class="empty-state" id="emptyState">
          <div class="big">未配置，全部跟随全局</div>
          <div class="small">此项目尚未创建权限配置。创建后将生成 <code>.pi/extensions/pi-permission-system/config.json</code>，保存即生效。</div>
          <button class="create-btn" id="createBtn">新建配置</button>
        </div>

        <!-- 已配置：继承视图（原型默认展示已配置态，点击"新建配置"可切换） -->
        <div id="configView" hidden>

          <!-- 组 1：bash 高危命令族 -->
          <div class="rule-group" id="group-destructive-fs">
            <div class="group-head">
              <span class="chevron">▼</span>
              <span class="gname">删除文件 <span class="rule-desc">rm / rmdir · 高危</span></span>
              <span class="override-badge">2 项已覆盖</span>
            </div>
            <div class="group-body">
              <div class="rule-row">
                <div><div class="rule-name"><code>rm *</code></div><div class="rule-desc">删除任意文件/目录</div></div>
                <div><div class="col-label">全局默认</div><div class="global-val"><span class="pill">询问 ask</span></div></div>
                <div><div class="col-label">项目值</div><div class="project-val">
                  <span class="seg" data-rule="rm"><button class="on">允许</button><button>询问</button></span>
                </div></div>
                <div class="overridden-mark">项目已改</div>
              </div>
              <div class="rule-row">
                <div><div class="rule-name"><code>rmdir *</code></div><div class="rule-desc">删除空目录</div></div>
                <div><div class="col-label">全局默认</div><div class="global-val"><span class="pill">询问 ask</span></div></div>
                <div><div class="col-label">项目值</div><div class="project-val">
                  <span class="seg" data-rule="rmdir"><button class="on">允许</button><button>询问</button></span>
                </div></div>
                <div class="overridden-mark">项目已改</div>
              </div>
              <div class="rule-row">
                <div><div class="rule-name"><code>kill / pkill</code></div><div class="rule-desc">终止进程</div></div>
                <div><div class="col-label">全局默认</div><div class="global-val"><span class="pill">询问 ask</span></div></div>
                <div><div class="col-label">项目值</div><div class="project-val"><span class="inherit-mark">跟随全局</span></div></div>
                <div></div>
              </div>
              <div class="rule-row">
                <div><div class="rule-name"><code>rm</code>（裸）</div><div class="rule-desc">无参数 rm</div></div>
                <div><div class="col-label">全局默认</div><div class="global-val"><span class="pill">询问 ask</span></div></div>
                <div><div class="col-label">项目值</div><div class="project-val"><span class="inherit-mark">跟随全局</span></div></div>
                <div></div>
              </div>
            </div>
          </div>

          <!-- 组 2：提权 / 系统操作 -->
          <div class="rule-group" id="group-privilege">
            <div class="group-head">
              <span class="chevron">▼</span>
              <span class="gname">提权与系统操作 <span class="rule-desc">sudo / chmod / chown / dd / mkfs</span></span>
              <span class="override-badge">1 项已覆盖</span>
            </div>
            <div class="group-body">
              <div class="rule-row">
                <div><div class="rule-name"><code>sudo *</code></div><div class="rule-desc">提权执行</div></div>
                <div><div class="col-label">全局默认</div><div class="global-val"><span class="pill">询问 ask</span></div></div>
                <div><div class="col-label">项目值</div><div class="project-val">
                  <span class="seg" data-rule="sudo"><button>允许</button><button class="on">询问</button></span>
                </div></div>
                <div class="overridden-mark">项目已改</div>
              </div>
              <div class="rule-row">
                <div><div class="rule-name"><code>chmod * / chown *</code></div><div class="rule-desc">修改权限/属主</div></div>
                <div><div class="col-label">全局默认</div><div class="global-val"><span class="pill">询问 ask</span></div></div>
                <div><div class="col-label">项目值</div><div class="project-val"><span class="inherit-mark">跟随全局</span></div></div>
                <div></div>
              </div>
              <div class="rule-row">
                <div><div class="rule-name"><code>dd * / mkfs *</code></div><div class="rule-desc">磁盘低级操作</div></div>
                <div><div class="col-label">全局默认</div><div class="global-val"><span class="pill">询问 ask</span></div></div>
                <div><div class="col-label">项目值</div><div class="project-val"><span class="inherit-mark">跟随全局</span></div></div>
                <div></div>
              </div>
            </div>
          </div>

          <!-- 组 3：重定向 / 管道（pre-gate 族，只活在评估器） -->
          <div class="rule-group closed" id="group-redirect">
            <div class="group-head">
              <span class="chevron">▼</span>
              <span class="gname">重定向 / 管道 <span class="rule-desc">&gt; 写入文件 · | bash 管道执行</span></span>
              <span class="override-badge" hidden>0 项已覆盖</span>
            </div>
            <div class="group-body">
              <div class="rule-row">
                <div><div class="rule-name"><code>&gt; file</code></div><div class="rule-desc">重定向写文件（pre-gate 评估）</div></div>
                <div><div class="col-label">全局默认</div><div class="global-val"><span class="pill">询问 ask</span></div></div>
                <div><div class="col-label">项目值</div><div class="project-val"><span class="inherit-mark">跟随全局</span></div></div>
                <div></div>
              </div>
              <div class="rule-row">
                <div><div class="rule-name"><code>| bash</code></div><div class="rule-desc">管道到 shell</div></div>
                <div><div class="col-label">全局默认</div><div class="global-val"><span class="pill">询问 ask</span></div></div>
                <div><div class="col-label">项目值</div><div class="project-val"><span class="inherit-mark">跟随全局</span></div></div>
                <div></div>
              </div>
            </div>
          </div>

          <!-- 组 4：工具级裁决 -->
          <div class="rule-group" id="group-tools">
            <div class="group-head">
              <span class="chevron">▼</span>
              <span class="gname">工具级裁决 <span class="rule-desc">read/write/edit/… 允许或询问</span></span>
              <span class="override-badge">1 项已覆盖</span>
            </div>
            <div class="group-body">
              <div class="tool-row">
                <div class="rule-name"><code>read</code></div>
                <div class="rule-desc">读取文件</div>
                <div><div class="col-label">全局默认</div><div class="global-val"><span class="pill">允许 allow</span></div></div>
                <div><div class="col-label">项目值</div><div class="project-val"><span class="inherit-mark">跟随全局</span></div></div>
              </div>
              <div class="tool-row">
                <div class="rule-name"><code>write</code></div>
                <div class="rule-desc">写入文件</div>
                <div><div class="col-label">全局默认</div><div class="global-val"><span class="pill">询问 ask</span></div></div>
                <div><div class="col-label">项目值</div><div class="project-val">
                  <span class="seg" data-rule="write"><button class="on">允许</button><button>询问</button></span>
                </div></div>
              </div>
              <div class="tool-row">
                <div class="rule-name"><code>edit / create / delete</code></div>
                <div class="rule-desc">编辑/创建/删除</div>
                <div><div class="col-label">全局默认</div><div class="global-val"><span class="pill">询问 ask</span></div></div>
                <div><div class="col-label">项目值</div><div class="project-val"><span class="inherit-mark">跟随全局</span></div></div>
              </div>
              <div class="tool-row">
                <div class="rule-name"><code>ls / grep / find</code></div>
                <div class="rule-desc">查询类</div>
                <div><div class="col-label">全局默认</div><div class="global-val"><span class="pill">允许 allow</span></div></div>
                <div><div class="col-label">项目值</div><div class="project-val"><span class="inherit-mark">跟随全局</span></div></div>
              </div>
            </div>
          </div>

          <!-- 组 5：path 白名单 -->
          <div class="rule-group" id="group-path">
            <div class="group-head">
              <span class="chevron">▼</span>
              <span class="gname">path 白名单 <span class="rule-desc">允许直接访问的路径</span></span>
              <span class="override-badge" hidden>0 项已覆盖</span>
            </div>
            <div class="group-body">
              <div class="path-editor">
                <div class="path-list" id="pathList">
                  <div class="path-item">*<button class="del" data-path="*">✕</button></div>
                </div>
                <div class="path-add">
                  <input id="pathInput" placeholder="添加路径 glob，如 src/** 或 /tmp/build-*">
                  <button id="pathAddBtn">添加</button>
                </div>
                <div style="margin-top:6px" class="rule-desc">全局默认：<code>*</code> 全部允许（read/ls 类）。项目未覆盖时跟随。</div>
              </div>
            </div>
          </div>

          <!-- 组 6：外部目录 -->
          <div class="rule-group closed" id="group-extdir">
            <div class="group-head">
              <span class="chevron">▼</span>
              <span class="gname">外部目录 <span class="rule-desc">项目目录外的访问面</span></span>
              <span class="override-badge" hidden>0 项已覆盖</span>
            </div>
            <div class="group-body">
              <div class="path-editor">
                <div class="path-list" id="extList"></div>
                <div class="path-add">
                  <input id="extInput" placeholder="添加外部目录路径">
                  <button id="extAddBtn">添加</button>
                </div>
              </div>
            </div>
          </div>

          <!-- 组 7：授权链 + 开关 -->
          <div class="rule-group" id="group-misc">
            <div class="group-head">
              <span class="chevron">▼</span>
              <span class="gname">授权链与开关 <span class="rule-desc">authorizerChain · yoloMode · debugLog · …</span></span>
              <span class="override-badge" hidden>0 项已覆盖</span>
            </div>
            <div class="group-body">
              <div class="switch-row">
                <div><div class="sname">authorizerChain</div><div class="sdesc">权限评估链顺序</div></div>
                <div class="chain-row"><span>opc-bridge</span><span class="arrow">→</span><span>default</span></div>
              </div>
              <div class="switch-row">
                <div><div class="sname">yoloMode</div><div class="sdesc">跳过全部询问（危险，慎用）</div></div>
                <button class="toggle" data-toggle="yolo"></button>
              </div>
              <div class="switch-row">
                <div><div class="sname">doublePressToConfirm</div><div class="sdesc">确认需二次按键</div></div>
                <button class="toggle" data-toggle="double"></button>
              </div>
              <div class="switch-row">
                <div><div class="sname">debugLog</div><div class="sdesc">权限评估调试日志</div></div>
                <button class="toggle on" data-toggle="debug"></button>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- ============ JSON 模式 ============ -->
      <div class="json-mode">
        <div class="custom-field-note">
          <b>ℹ 自定义字段保护</b>：面板无法识别的顶层/深层字段将保留在文件中，切换可视化保存不会被冲掉（此提示在原型中常驻示意）。
        </div>
        <textarea class="json-editor" id="jsonEditor" spellcheck="false">{
  "debugLog": true,
  "yoloMode": false,
  "doublePressToConfirm": false,
  "toolInputPreviewMaxLength": 400,
  "toolTextSummaryMaxLength": 120,
  "piInfrastructureReadPaths": [],
  "authorizerChain": [
    "opc-bridge"

      // Cap growth so content sized relative to the container (height:100%
      // plus a fixed extra) can never ratchet the stage upward forever.
      var contentH = Math.min(rootEl.scrollHeight, Math.max(card.h, 4000));
      if (contentH > (card.eh || card.h) + 1) card.eh = contentH;
    }
    var h = Math.max(card.eh || 0, card.h);
    stage.style.height = h + "px";
    // Width-only scaling: height never shrinks the card (it would leave blank
    // bands beside the narrower stage). The wrap shrink-wraps the scaled stage
    // so its frame always hugs the visible pixels.
    var scale = Math.min(cw / card.w, 1);
    stage.style.transform = scale === 1 ? "none" : "scale(" + scale + ")";
    wrap.style.width = Math.ceil(card.w * scale) + "px";
    wrap.style.height = Math.ceil(h * scale) + "px";
  }

  var sections = [].slice.call(document.querySelectorAll("[data-card]"));
  function fitAll() { sections.forEach(fit); }

  // ---- mount all cards
  sections.forEach(function (section) {
    var card = cardById[section.id];
    if (!card) return;
    var stage = section.querySelector("[data-stage]");
    try {
      var root = ensureShadow(stage);
      var rootEl = root.querySelector(".__dsroot");
      applyStyles(root, card.css);
      var env = makeEnv(card, root, rootEl);
      if (card.js.length) runScripts(card, env);
      bindInlineHandlers(card, env, rootEl);
      // Card content keeps changing after mount (React commits async, icon
      // fetches resolve, images decode) — re-measure on every DOM change and
      // resource load inside the shadow tree.
      if (window.MutationObserver) {
        new MutationObserver(function () { fit(section); }).observe(root, {
          childList: true,
          subtree: true,
          attributes: true,
          characterData: true,
        });
      }
      root.addEventListener("load", function () { fit(section); }, true);
    } catch (err) {
      console.error("[ds-preview] mount " + card.id + ":", err);
    }
    stage.setAttribute("data-ready", "1");
    fit(section);
  });

  // ---- scaling
  var scroller = document.querySelector("[data-scroll]");
  var inner = document.querySelector(".ds-content-inner");
  if (window.ResizeObserver && inner) {
    var raf = 0;
    new ResizeObserver(function () {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(fitAll);
    }).observe(inner);
  } else {
    window.addEventListener("resize", fitAll);
  }
  // Web fonts swap and late resources settle without DOM mutations —
  // re-measure once fonts are ready plus a few fallback ticks.
  if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
    document.fonts.ready.then(function () { fitAll(); });
  }
  [250, 750, 1500, 3000].forEach(function (ms) { setTimeout(fitAll, ms); });

  // ---- outline interactions
  var items = [].slice.call(document.querySelectorAll(".ds-item[data-target]"));
  var itemByTarget = {};
  items.forEach(function (it) { itemByTarget[it.getAttribute("data-target")] = it; });
  var anchors = [].slice.call(document.querySelectorAll("[data-anchor]"));
  var suppressUntil = 0;

  function setActive(it) {
    items.forEach(function (x) { x.classList.toggle("active", x === it); });
    if (it) {
      var g = it.closest(".ds-outline-group");
      if (g) g.classList.remove("collapsed");
    }
  }

  items.forEach(function (it) {
    it.addEventListener("click", function () {
      var target = document.getElementById(it.getAttribute("data-target"));
      if (!target || !scroller) return;
      var top = scroller.scrollTop + target.getBoundingClientRect().top - scroller.getBoundingClientRect().top - 20;
      suppressUntil = Date.now() + 900;
      setActive(it);
      scroller.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
    });
  });

  [].slice.call(document.querySelectorAll("[data-group-toggle]")).forEach(function (btn) {
    btn.addEventListener("click", function () {
      btn.closest(".ds-outline-group").classList.toggle("collapsed");
    });
  });

  function spy() {
    if (Date.now() < suppressUntil || !scroller) return;
    var cTop = scroller.getBoundingClientRect().top;
    var best = null;
    for (var i = 0; i < anchors.length; i++) {
      var r = anchors[i].getBoundingClientRect();
      if (r.top - cTop <= 90) best = anchors[i];
      else break;
    }
    if (!best && anchors.length) best = anchors[0];
    if (best) {
      var key = best.getAttribute("data-anchor-key") || best.id;
      setActive(itemByTarget[key] || itemByTarget[best.id] || null);
    }
  }
  if (scroller) {
    var sraf = 0;
    scroller.addEventListener("scroll", function () {
      cancelAnimationFrame(sraf);
      sraf = requestAnimationFrame(spy);
    }, { passive: true });
    spy();
  }

  // ---- readme collapse
  var readme = document.querySelector("[data-readme]");
  var toggle = document.querySelector("[data-readme-toggle]");
  if (readme && toggle) {
    var update = function () {
      var collapsed = readme.classList.contains("collapsed");
      toggle.textContent = collapsed ? "Show more" : "Show less";
    };
    if (readme.scrollHeight <= 300) {
      readme.classList.remove("collapsed");
      toggle.style.display = "none";
    }
    toggle.addEventListener("click", function () {
      readme.classList.toggle("collapsed");
      update();
      fitAll();
    });
    update();
  }

  window.addEventListener("load", fitAll);
})();

</script>
</body>
</html>
