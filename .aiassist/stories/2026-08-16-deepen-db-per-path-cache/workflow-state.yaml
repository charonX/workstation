story_id: 2026-08-16-deepen-db-per-path-cache
intention: >-
  全局单槽连接按路径切换即关旧库：每个模块被迫「每次操作重新取」并堆防御注释，
  跨库 join 全部 JS 侧手工归并，缓存一次句柄即埋 database-not-open。
  一句话痛点：连接生命周期是全局隐式状态，正确用法靠注释与纪律维持。   # 一句话痛点,非方案。这是 story 的初衷,方案会变,痛点不会。

phase: PRD        # THINK / PRD / DESIGN / DOMAIN-MODEL / TECH-DESIGN(仅 complex；simple 直接结晶) / CRYSTALLIZE / TEST / ASSERTION-SIGNOFF / BUILD / QA / BUG / REFLECT
attempt: 1        # 第几次尝试。归档重做时 +1。
bug-counter: 0    # story 内 bug 计数，/bug 每次修复 +1，用于 commit [bugfix] BUG-NNN。
created: 2026-08-16

# 阶段流转历史。正常前进和回流都记一条。
