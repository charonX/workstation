  - {at: 2026-08-16, from: -, to: THINK, note: "创建 story（/improve-codebase-architecture 评审候选 #5，报告存档 .aiassist/global/architecture-reviews/architecture-review-2026-08-16.html）"}
  - {at: 2026-08-18, from: THINK, to: PRD, note: "需求洞察完成（interview-notes.md）：勘察 55 处 getDb 调用横跨 20+ 模块、单槽切路径即关旧库、closeDb 只关单连接、:memory: 共享语义。四问全确认（用户拍板）：①缓存生命周期=进程+closeDb 关全部 ②范围=只改 db.js+最少必要调用点，注释删除逐模块 ③:memory:=缓存但 closeDb 清全部 ④API=透明替换 getDb 签名不变。方向锁定：per-path 连接缓存（Outcome 双库并存句柄可缓存 / Out of scope 55 点全量重构+跨库 join+LRU）"}

