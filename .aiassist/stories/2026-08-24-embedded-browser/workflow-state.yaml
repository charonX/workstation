# Test-as-Contract workflow state
# 由 /story 创建和维护。本文件是状态机,不归档(回流时更新,不搬进 archive/)。

story_id: 2026-08-24-embedded-browser
intention: >-
  agent 在 workstation 里起了 web 服务或产出了页面后，用户要切到外部浏览器、
  手动找端口输地址才能验证效果，「对话 → 看结果」的闭环被打断；
  agent 需要浏览网页时用户也看不到它在看什么。   # 一句话痛点,非方案。这是 story 的初衷,方案会变,痛点不会。

phase: QA # THINK / PRD / DESIGN / DOMAIN-MODEL / TECH-DESIGN(仅 complex；simple 直接结晶) / CRYSTALLIZE / TEST / ASSERTION-SIGNOFF / BUILD / QA / BUG / REFLECT
                  # 注：CRYSTALLIZE → TEST → ASSERTION-SIGNOFF 由 /story 自动链一次推进（仅升级点停下；单独调子 skill 也可推进）；其余阶段逐阶段路由。
attempt: 1        # 第几次尝试。归档重做时 +1。
bug-counter: 0    # story 内 bug 计数，/bug 每次修复 +1，用于 commit [bugfix] BUG-NNN。
created: 2026-08-24
status: active    # active / completed。由 /reflect 收尾时置为 completed，随后整个 story 目录提交删除（进 git 历史）；已完成 story 不回流，spec 不保留（逻辑看代码+测试、意图看全局文档）。
completed_at: ""  # /reflect 标记完成时写入，如 2026-08-17。

