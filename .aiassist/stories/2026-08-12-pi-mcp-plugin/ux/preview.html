<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ux — Design system</title>
<style>

:root {
  color-scheme: light;
  --ds-bg: #FAF9F5;
  --ds-surface: #FFFFFF;
  --ds-text: rgba(15, 12, 8, 0.92);
  --ds-text-2: rgba(15, 12, 8, 0.62);
  --ds-text-3: rgba(15, 12, 8, 0.46);
  --ds-border: rgba(15, 12, 8, 0.10);
  --ds-border-soft: rgba(15, 12, 8, 0.07);
  --ds-hover: rgba(15, 12, 8, 0.045);
  --ds-active: rgba(15, 12, 8, 0.07);
  --ds-accent: #D97757;
  --ds-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --ds-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--ds-font);
  background: var(--ds-bg);
  color: var(--ds-text);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

.ds-pane { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

/* ------------------------------------------------- outline (left nav) */
.ds-outline {
  flex: 0 0 248px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--ds-border-soft);
  background: var(--ds-bg);
}
@media (max-width: 1007px) { .ds-outline { display: none; } }
.ds-outline-head { padding: 18px 16px 12px; }
.ds-outline-head h1 { margin: 0; font-size: 18px; font-weight: 550; letter-spacing: -0.01em; color: var(--ds-text); }
.ds-outline-scroll { flex: 1; overflow-y: auto; padding: 4px 8px 16px; scrollbar-width: thin; }
.ds-pinned { margin: 0 0 4px; padding: 0 0 6px; border-bottom: 1px solid var(--ds-border-soft); }
.ds-item {
  display: flex; align-items: center; width: 100%;
  text-align: left; padding: 5px 8px 5px 24px;
  font-size: 12px; line-height: 1.35; color: var(--ds-text-2);
  border-radius: 6px;
}
.ds-item:hover { background: var(--ds-hover); color: var(--ds-text); }
.ds-item.active { font-weight: 550; color: var(--ds-text); background: var(--ds-active); }
.ds-item .ds-ic { flex: 0 0 auto; width: 13px; height: 13px; margin-left: -19px; margin-right: 6px; opacity: 0.75; }
.ds-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ds-group-btn {
  display: flex; align-items: center; gap: 5px; width: 100%;
  padding: 6px 8px; margin-top: 6px;
  font-size: 12px; font-weight: 550; color: var(--ds-text-2);
  border-radius: 6px;
}
.ds-group-btn:hover { background: var(--ds-hover); color: var(--ds-text); }
.ds-group-btn .ds-caret { width: 9px; height: 9px; flex: 0 0 auto; transition: transform 0.15s ease; opacity: 0.7; }
.ds-outline-group.collapsed .ds-caret { transform: rotate(-90deg); }
.ds-outline-group.collapsed .ds-group-items { display: none; }
.ds-group-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ------------------------------------------------------- content column */
.ds-content { flex: 1 1 auto; min-width: 0; overflow-y: auto; overscroll-behavior: contain; }
.ds-content-inner {
  display: flex; flex-direction: column; gap: 24px;
  padding: 30px 16px 80px;
  max-width: 760px; margin: 0 auto;
}
.ds-group-label { margin: 6px 0 14px; font-size: 13px; font-weight: 550; color: var(--ds-text); }
.ds-card + .ds-card { margin-top: 26px; }
.ds-card-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
.ds-card-title { margin: 0; font-size: 13.5px; font-weight: 550; line-height: 1.3; color: var(--ds-text); }
.ds-card-sub { margin: 2px 0 0; font-size: 12px; line-height: 1.45; color: var(--ds-text-3); }
.ds-prevwrap {
  position: relative; overflow: hidden;
  border: 1px solid var(--ds-border-soft); border-radius: 8px;
  background: #fff;
}
/* Outer-tree color-scheme on the shadow host beats the card's own
   ':host { color-scheme: light dark }' (rewritten from ':root'), so
   light-dark() tokens resolve LIGHT regardless of the viewer's OS theme —
   the preview chrome is light-only. Cards opting into dark explicitly
   (e.g. a '.spectrum-dark' subtree) still render dark. */
.ds-stage { transform-origin: top left; visibility: hidden; color-scheme: light; }
.ds-stage[data-ready] { visibility: visible; }

/* ------------------------------------------------------------- readme */
.ds-readme-body { position: relative; }
.ds-readme-body.collapsed { max-height: 280px; overflow: hidden; }
.ds-readme-body.collapsed::after {
  content: ""; position: absolute; inset: auto 0 0 0; height: 64px;
  background: linear-gradient(to bottom, rgba(250, 249, 245, 0), var(--ds-bg));
  pointer-events: none;
}
.ds-readme-toggle { margin-top: 8px; font-size: 12px; font-weight: 500; color: var(--ds-text-2); }
.ds-readme-toggle:hover { color: var(--ds-text); }

/* -------------------------------------------------------------- prose */
.ds-prose { font-size: 13px; line-height: 1.6; color: var(--ds-text); }
.ds-prose > :first-child { margin-top: 0; }
.ds-prose h1 { font-size: 19px; font-weight: 600; margin: 22px 0 8px; letter-spacing: -0.01em; }
.ds-prose h2 { font-size: 16px; font-weight: 600; margin: 20px 0 6px; }
.ds-prose h3 { font-size: 13.5px; font-weight: 600; margin: 16px 0 4px; }
.ds-prose h4, .ds-prose h5, .ds-prose h6 { font-size: 12.5px; font-weight: 600; margin: 14px 0 4px; }
.ds-prose p { margin: 0 0 10px; }
.ds-prose ul, .ds-prose ol { margin: 0 0 10px; padding-left: 22px; }
.ds-prose li { margin: 2px 0; }
.ds-prose code {
  font-family: var(--ds-mono); font-size: 0.92em;
  background: rgba(15, 12, 8, 0.055); border-radius: 4px; padding: 0.1em 0.35em;
}
.ds-prose pre {
  background: rgba(15, 12, 8, 0.045); border: 1px solid var(--ds-border-soft);
  border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: 0 0 12px;
}
.ds-prose pre code { background: none; padding: 0; font-size: 11.5px; line-height: 1.55; }
.ds-prose blockquote {
  margin: 0 0 10px; padding: 2px 0 2px 12px;
  border-left: 3px solid rgba(15, 12, 8, 0.14); color: var(--ds-text-2);
}
.ds-prose hr { border: 0; border-top: 1px solid var(--ds-border-soft); margin: 16px 0; }
.ds-prose table { border-collapse: collapse; margin: 0 0 12px; font-size: 12px; width: 100%; }
.ds-prose th, .ds-prose td { border: 1px solid var(--ds-border); padding: 5px 9px; text-align: left; vertical-align: top; }
.ds-prose th { background: rgba(15, 12, 8, 0.035); font-weight: 600; }
.ds-prose img { max-width: 100%; border-radius: 6px; }
.ds-prose a { color: inherit; text-decoration: underline; text-decoration-color: rgba(15, 12, 8, 0.3); }
.ds-prose a:hover { text-decoration-color: currentColor; }

.ds-empty { font-size: 13px; color: var(--ds-text-3); padding: 24px 0; }

</style>

</head>
<body>
<div class="ds-pane">
<nav class="ds-outline" aria-label="Design system outline"><div class="ds-outline-head"><h1>Design system</h1></div><div class="ds-outline-scroll"><div class="ds-outline-group"><button class="ds-group-btn" data-group-toggle><svg class="ds-caret" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1.5 3.25 5 6.75l3.5-3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>dialogue</span></button><div class="ds-group-items"><button class="ds-item" data-target="g-dialogue"><span>composer-stop</span></button><button class="ds-item" data-target="card-1-oauth-present"><span>oauth-present</span></button></div></div><div class="ds-outline-group"><button class="ds-group-btn" data-group-toggle><svg class="ds-caret" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1.5 3.25 5 6.75l3.5-3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>management</span></button><div class="ds-group-items"><button class="ds-item" data-target="g-management"><span>plugins-page</span></button></div></div><div class="ds-outline-group"><button class="ds-group-btn" data-group-toggle><svg class="ds-caret" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1.5 3.25 5 6.75l3.5-3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>permission</span></button><div class="ds-group-items"><button class="ds-item" data-target="g-permission"><span>permission-mcp-group</span></button></div></div></div></nav>
<main class="ds-content" data-scroll>
<div class="ds-content-inner">
<div class="ds-group" id="g-dialogue" data-anchor data-anchor-key="g-dialogue"><h2 class="ds-group-label">dialogue</h2><section class="ds-card" id="card-0-composer-stop" data-card data-anchor data-anchor-key="g-dialogue"><header class="ds-card-head"><div><h3 class="ds-card-title">composer-stop</h3></div></header><div class="ds-prevwrap" data-fit style="box-sizing:content-box;width:720px;height:420px;"><div class="ds-stage" data-stage style="width:720px;height:420px;"><template shadowrootmode="open"><div class="__dsroot" style="margin:0;width:100%;height:100%;overflow:auto;box-sizing:border-box;"><div class="stage">
  <div class="stage-note">REQ-AGENT-091（BUG-010 就地补全）· 对话手动停止——Composer 流式中发送键位变「停止」键。语义边界：已生成文本保留（不加中断标记）；挂起确认卡不随停止撤销；停止后可立即发下一条。</div>

  <!-- ============ 态 1：idle（既有形态，对照基准） ============ -->
  <div class="case">
    <div class="case-title">态 1 · idle（既有，对照基准）——发送键，空输入 disabled</div>
    <div class="composer">
      <div class="composer-row">
        <textarea class="composer-input" placeholder="随心输入…"></textarea>
        <button class="send-btn" data-testid="send-button" disabled>发送</button>
      </div>
    </div>
  </div>

  <!-- ============ 态 2：流式中（新增停止键） ============ -->
  <div class="case">
    <div class="case-title">态 2 · 流式中（本原型新增）——发送键位变「停止」键（可点）；输入框保持可编辑（排队语义不变）</div>
    <div class="bubble-stream">正在生成的回复文本保留在气泡中，停止后原样留存<span class="cursor"></span></div>
    <div class="composer">
      <div class="composer-row">
        <textarea class="composer-input" placeholder="随心输入…">中途想到补充，可以直接打字…</textarea>
        <button class="stop-btn" data-testid="stop-button"><span class="sq"></span>停止</button>
      </div>
    </div>
  </div>
</div></div></template></div></div></section><section class="ds-card" id="card-1-oauth-present" data-card data-anchor data-anchor-key="card-1-oauth-present"><header class="ds-card-head"><div><h3 class="ds-card-title">oauth-present</h3></div></header><div class="ds-prevwrap" data-fit style="box-sizing:content-box;width:728px;height:486px;"><div class="ds-stage" data-stage style="width:1080px;height:720px;transform:scale(0.674074074074074);"><template shadowrootmode="open"><div class="__dsroot" style="margin:0;width:100%;height:100%;overflow:auto;box-sizing:border-box;"><div class="stage">
  <div class="stage-note">UX 原型 · OAuth 授权 URL 呈现（PRD §10.2 / REFLECT 人工验收项）· 交互：打开授权页（模拟外部浏览器）→ 轮询等待 → 已授权；过期重发；通知点击定位对话卡片</div>

  <div class="compare">
    <!-- ============ 形态 A：对话内授权卡 ============ -->
    <div>
      <div class="pane-title">形态 A · 对话内授权卡（主形态）</div>
      <div class="chat" data-testid="oauth-chat">
        <div class="msg-user">用 github MCP 帮我看下 workstation 仓库最近打开的 issue</div>
        <div class="msg-agent">好的。调用 github 的 MCP 工具前需要先完成 OAuth 授权：</div>

        <div class="oauth-card" data-testid="oauth-card" id="oauth-card">
          <div class="oc-title">🔐 授权 MCP 服务「github」</div>
          <div class="oc-desc">该服务要求 OAuth 授权。点击下方按钮在浏览器中完成授权；授权仅对服务「github」生效，令牌存系统凭据库。</div>
          <div class="oc-url" data-testid="oauth-url">https://github.com/login/oauth/authorize?client_id=Ov23li…&amp;scope=repo&amp;state=8f2e…</div>
          <div class="oc-actions">
            <button class="btn btn-primary" data-testid="oauth-open-button" data-ds-onclick="openAuth()">打开授权页</button>
            <button class="btn" data-testid="oauth-copy-button" data-ds-onclick="copyUrl()">复制链接</button>
          </div>
          <div class="oc-status waiting" data-testid="oauth-status" id="oauth-status"><span class="dot pulse"></span>等待授权（10 分钟内有效）</div>
        </div>

        <div class="msg-agent" id="after-done" style="display:none">授权完成 ✅ 继续调用 <span class="mono" style="font-family:var(--ch-font-mono);font-size:var(--ch-text-xs)">github:list_issues</span> …</div>
      </div>
    </div>

    <!-- ============ 形态 B：通知中心条目 ============ -->
    <div>
      <div class="pane-title">形态 B · 通知中心条目（旁路提醒，点击定位对话卡片）</div>
      <div class="notify" data-testid="oauth-notification">
        <div class="notify-head">通知<span class="count">2</span></div>
        <div class="notify-item" id="notify-oauth" data-ds-onclick="locateCard()">
          <span class="n-icon">🔐</span>
          <div>
            <div class="n-title">MCP 服务「github」等待 OAuth 授权</div>
            <div class="n-sub">来自会话「workstation · 排查 issue」· 2 分钟前</div>
          </div>
          <span class="n-badge" id="notify-badge">待处理</span>
        </div>
        <div class="notify-item">
          <span class="n-icon" style="background: var(--ch-error-soft); color: var(--ch-error);">⚠</span>
          <div>
            <div class="n-title">MCP 服务「broken-svc」连接失败</div>
            <div class="n-sub">spawn run-missing-command ENOENT · 会话未受影响</div>
          </div>
        </div>
      </div>
      <div class="pane-title" style="margin-top: var(--ch-space-4);">说明</div>
      <div style="font-size: var(--ch-text-xs); color: var(--ch-text-secondary); line-height: var(--ch-leading-relaxed);">
        授权卡在对话流内即上下文本体，是主形态；通知只做旁路提醒（用户切走时能看到），点击滚动定位到对话内卡片。授权过期 → 卡片状态变「已过期」+「重新发起」按钮。
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div></div></template></div></div></section></div><div class="ds-group" id="g-management" data-anchor data-anchor-key="g-management"><h2 class="ds-group-label">management</h2><section class="ds-card" id="card-2-plugins-page" data-card data-anchor data-anchor-key="g-management"><header class="ds-card-head"><div><h3 class="ds-card-title">plugins-page</h3></div></header><div class="ds-prevwrap" data-fit style="box-sizing:content-box;width:728px;height:553px;"><div class="ds-stage" data-stage style="width:1080px;height:820px;transform:scale(0.674074074074074);"><template shadowrootmode="open"><div class="__dsroot" style="margin:0;width:100%;height:100%;overflow:auto;box-sizing:border-box;"><div class="stage">
  <div class="stage-note">UX 原型 · 管理区「插件」页（REQ-AGENT-083/084 结构契约锚点）· 交互：添加插件弹窗 / 来源切换 / 项目启用 popover / MCP 表单类型切换 / 错误态演示</div>

  <div class="page" data-testid="plugins-page">
    <div class="page-header">
      <div>
        <h1 class="page-title">插件</h1>
        <div class="page-sub">PI agent 扩展与 MCP 服务 · 集中安装，按项目启用</div>
      </div>
      <button class="btn btn-primary" data-testid="plugin-add-button" data-ds-onclick="openModal('add-plugin')">添加插件</button>
    </div>

    <!-- ============ ① 扩展插件清单 ============ -->
    <div class="section">
      <div class="section-head">
        <span class="section-title">扩展插件</span>
        <span class="section-desc">npm / git / 本地路径 · 真相 = pi 全局设置</span>
      </div>
      <table data-testid="plugin-table">
        <thead>
          <tr><th>名称</th><th>来源</th><th>版本</th><th>状态</th><th>项目启用</th><th></th></tr>
        </thead>
        <tbody id="plugin-rows">
          <tr data-testid="plugin-row-pi-mcp-adapter">
            <td class="name-cell">pi-mcp-adapter<span class="sub mono">npm:pi-mcp-adapter@2.23.0</span></td>
            <td><span class="badge npm">npm</span></td>
            <td class="mono">2.23.0</td>
            <td><span class="badge ok">内置</span> <span class="section-desc">随应用发布，不可停用</span></td>
            <td><span class="section-desc">—（由 MCP 服务启用控制）</span></td>
            <td></td>
          </tr>
          <tr data-testid="plugin-row-git-checkpoint">

            <td class="mono">v1.4.0</td>
            <td><span class="badge ok">正常</span></td>
            <td class="toggle-cell">

                <div class="pop-row" data-ds-onclick="flipSwitch(this)"><span class="proj">side-blog</span><span class="switch on"></span></div>
                <div class="pop-row" data-ds-onclick="flipSwitch(this)"><span class="proj">data-pipeline</span><span class="switch"></span></div>
              </div>
            </td>
            <td style="text-align:right"><button class="btn-tertiary danger" data-testid="plugin-remove-button" data-ds-onclick="removeRow(this)">移除</button></td>
          </tr>
          <tr class="row-error" data-testid="plugin-row-error">
            <td class="name-cell">local-tools<span class="sub mono">/Users/me/dev/my-pi-ext</span></td>
            <td><span class="badge local">本地</span></td>
            <td class="mono">—</td>
            <td><span class="badge error">加载失败</span><div class="error-detail">SyntaxError: Unexpected token (my-pi-ext/index.ts:14) — 会话不受影响，其余插件正常</div></td>

    </div>

    <!-- ============ ② MCP 服务清单 ============ -->
    <div class="section">
      <div class="section-head">
        <span class="section-title">MCP 服务</span>
        <span class="section-desc">配置存 workstation · 新会话生效 · 调用全程过权限面</span>
        <button class="btn" data-testid="mcp-add-button" data-ds-onclick="openModal('add-mcp')">添加 MCP 服务</button>
      </div>
      <table data-testid="mcp-table">
        <thead>
          <tr><th>名称</th><th>类型</th><th>端点</th><th>全局开关</th><th>项目启用</th><th></th></tr>
        </thead>
        <tbody>
          <tr data-testid="mcp-row-local-db">
            <td class="name-cell">local-db</td>
            <td><span class="badge local">stdio</span></td>
            <td class="mono">npx -y @modelcontextprotocol/server-sqlite …</td>
            <td><span class="switch on" data-ds-onclick="flipSelf(this)" data-testid="mcp-global-toggle"></span></td>
            <td class="toggle-cell">
              <button class="toggle-pill on" data-ds-onclick="togglePop(this)">1 个项目 ▸</button>
              <div class="toggle-pop">
                <div class="pop-title">按项目启用</div>
                <div class="pop-row" data-ds-onclick="flipSwitch(this)"><span class="proj">charon/workstation</span><span class="switch on"></span></div>
                <div class="pop-row" data-ds-onclick="flipSwitch(this)"><span class="proj">side-blog</span><span class="switch"></span></div>
              </div>
            </td>
            <td style="text-align:right"><button class="btn-tertiary" data-ds-onclick="openModal('add-mcp')">编辑</button><button class="btn-tertiary danger" data-ds-onclick="removeRow(this)">删除</button></td>
          </tr>
          <tr data-testid="mcp-row-github">
            <td class="name-cell">github</td>
            <td><span class="badge git">http</span></td>
            <td class="mono">https://api.githubcopilot.com/mcp/ · bearer</td>
            <td><span class="switch on" data-ds-onclick="flipSelf(this)"></span></td>
            <td class="toggle-cell">
              <button class="toggle-pill" data-ds-onclick="togglePop(this)">未启用 ▸</button>
              <div class="toggle-pop">

<!-- ============ 添加/编辑 MCP 服务弹窗（stdio / http 类型切换） ============ -->
<div class="overlay" id="overlay-add-mcp" data-testid="mcp-form-modal">
  <div class="modal">
    <div class="modal-head"><span class="modal-title">添加 MCP 服务</span><button class="modal-close" data-ds-onclick="closeModal('add-mcp')">✕</button></div>
    <div class="modal-body">
      <div class="field">
        <label>名称（库内唯一）</label>
        <input data-testid="mcp-name-input" placeholder="local-db">
      </div>
      <div class="field">
        <label>连接类型</label>
        <div class="seg" data-testid="mcp-type-seg">
          <button class="active" data-type="stdio" data-ds-onclick="mcpTypePick(this)">stdio（本地命令）</button>
          <button data-type="http" data-ds-onclick="mcpTypePick(this)">HTTP（远程服务）</button>
        </div>
      </div>

      <div id="mcp-stdio-fields">
        <div class="field">
          <label>启动命令</label>
          <input data-testid="mcp-command-input" class="mono" placeholder="npx">
        </div>
        <div class="field" style="margin-top: var(--ch-space-3);">
          <label>参数（每行一个）</label>
          <textarea data-testid="mcp-args-input" class="mono" rows="2" placeholder="-y&#10;@modelcontextprotocol/server-sqlite"></textarea>
        </div>
        <div class="field" style="margin-top: var(--ch-space-3);">
          <label>环境变量（KEY=VALUE，每行一条）</label>
          <textarea data-testid="mcp-env-input" class="mono" rows="2" placeholder="DB_PATH=./data/app.db"></textarea>
        </div>
      </div>

      <div id="mcp-http-fields" style="display:none">
        <div class="field">
          <label>服务 URL</label>
          <input data-testid="mcp-url-input" class="mono" placeholder="https://example.com/mcp">
          <span class="err">URL 不合法（仅支持 http/https）</span>
        </div>
        <div class="field" style="margin-top: var(--ch-space-3);">
          <label>认证</label>
          <div class="seg" data-testid="mcp-auth-seg">
            <button class="active" data-auth="none" data-ds-onclick="mcpAuthPick(this)">无</button>
            <button data-auth="bearer" data-ds-onclick="mcpAuthPick(this)">Bearer Token</button>
            <button data-auth="oauth" data-ds-onclick="mcpAuthPick(this)">OAuth</button>
          </div>
          <span class="hint">Bearer token 加密存系统凭据库（不明文落库）；OAuth 授权链接将在对话中呈现（见 oauth-present 原型）</span>
        </div>
        <div class="field" id="mcp-token-field" style="display:none; margin-top: var(--ch-space-3);">
          <label>Bearer Token</label>
          <input data-testid="mcp-token-input" type="password" class="mono" placeholder="粘贴 token，保存后不再回显">
          <span class="hint">加密存储于系统凭据库（macOS Keychain）；保存/列表均不回显明文</span>
        </div>
        <div class="field" style="margin-top: var(--ch-space-3);">
          <label>请求头（KEY=VALUE，每行一条，可选）</label>
          <textarea data-testid="mcp-headers-input" class="mono" rows="2" placeholder="X-Team-Id=core"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-ds-onclick="closeModal('add-mcp')">取消</button>
      <button class="btn btn-primary" data-testid="mcp-form-submit" data-ds-onclick="toast('已保存，新会话生效')">保存</button>
    </div>
  </div>
</div>

      return "try{__vars." + n + "=" + n + ";}catch(__e){}";
    }).join("");
    return tail ? code + "\n;" + tail : code;
  }

  function makeEnv(card, root, rootEl) {
    var vars = Object.create(null);
    var pendingLoad = [];
    var realDoc = document;
    var realWin = window;
    var winProxy, docProxy;

    // Card sources live in subdirectories, but their HTML is re-rooted into
    // this single file — rebase relative fetch() URLs against the card's
    // source dir, serving build-time-inlined project assets when available
    // (which also makes them work over file://).
    vars.fetch = function (input, init) {
      var u = null;
      try { u = typeof input === "string" ? input : null; } catch (e) {}
      if (u != null && !/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(u) && u.charAt(0) !== "/" && u.charAt(0) !== "#" && u.charAt(0) !== "?") {
        var m = /^([^?#]*)([\s\S]*)$/.exec(u);
        var resolved = normPath((card.base ? card.base + "/" : "") + m[1]);
        if (Object.prototype.hasOwnProperty.call(ASSETS, resolved)) return realWin.fetch(ASSETS[resolved], init);
        return realWin.fetch(resolved + m[2], init);
      }
      return realWin.fetch(input, init);
    };

    docProxy = new Proxy(realDoc, {
      get: function (t, k) {
        switch (k) {
          case "getElementById":
            return function (id) {
              return root.getElementById ? root.getElementById(id) : root.querySelector("#" + (window.CSS && CSS.escape ? CSS.escape(id) : id));
            };
          case "querySelector": return root.querySelector.bind(root);
          case "querySelectorAll": return root.querySelectorAll.bind(root);
          case "getElementsByClassName": return function (c) { return rootEl.getElementsByClassName(c); };
          case "getElementsByTagName": return function (s) { return rootEl.getElementsByTagName(s); };
          case "body": case "documentElement": case "head": return rootEl;
          case "defaultView": return winProxy;
          case "readyState": return "complete";
          case "currentScript": return null;
          case "activeElement": return root.activeElement || null;
          case "styleSheets": return root.styleSheets;
          case "location": return realWin.location;
          case "addEventListener":
            return function (type, fn, o) {
              if (type === "DOMContentLoaded" || type === "load" || type === "readystatechange") pendingLoad.push(fn);
              else realDoc.addEventListener(type, fn, o);
            };
          case "removeEventListener": return realDoc.removeEventListener.bind(realDoc);
          default: {
            var v = t[k];
            return typeof v === "function" ? v.bind(t) : v;
          }
        }
      },
      set: function (t, k, val) {
        if (k === "title" || k === "cookie") return true;
        try { t[k] = val; } catch (e) {}
        return true;
      },
    });

    winProxy = new Proxy(realWin, {
      get: function (t, k) {
        switch (k) {
          case "document": return docProxy;
          case "window": case "self": case "globalThis": case "top": case "parent": case "frames": return winProxy;
          case "innerWidth": return card.w;
          case "innerHeight": return card.h;
          case "addEventListener":
            return function (type, fn, o) {
              if (type === "load" || type === "DOMContentLoaded") pendingLoad.push(fn);
              else t.addEventListener(type, fn, o);
            };
          case "removeEventListener": return t.removeEventListener.bind(t);
          default:
            if (k in vars) return vars[k];
            var v = t[k];
            if (typeof v === "function" && typeof k === "string" && /^[a-z]/.test(k)) {
              try { return v.bind(t); } catch (e) { return v; }
            }
            return v;
        }
      },
      set: function (t, k, val) {
        if (k === "onload") { pendingLoad.push(val); return true; }
        vars[k] = val;
        return true;
      },
      has: function (t, k) { return k in vars || k in t; },
    });

    var scope = new Proxy(vars, {
      has: function (t, k) {
        if (typeof k !== "string") return false;
        if (k === "window" || k === "document" || k === "globalThis" || k === "self" || k === "__vars" || k === "__scope" || k === "event") return false;
        return k in t;
      },
      get: function (t, k) { return t[k]; },
      set: function (t, k, v) { t[k] = v; return true; },
    });

    return { win: winProxy, doc: docProxy, vars: vars, scope: scope, pendingLoad: pendingLoad };
  }

  function runCode(card, env, code, name) {
    var body = "with(__scope){\n" + appendExports(code) + "\n}";
    try {
      var fn = new Function("window", "document", "globalThis", "self", "__vars", "__scope", body);
      fn.call(env.win, env.win, env.doc, env.win, env.win, env.vars, env.scope);
    } catch (err) {
      console.error("[ds-preview] " + card.id + (name ? " (" + name + ")" : "") + ":", err);
    }
  }

  function runScripts(card, env) {
    for (var i = 0; i < card.js.length; i++) {
      var s = card.js[i];
      var code = s.code;
      if (s.babel) {
        if (window.Babel) {
          try {
            code = Babel.transform(code, { presets: [["react", {}]], filename: s.name || "card.jsx" }).code;
          } catch (err) {
            console.error("[ds-preview] babel " + card.id + ":", err);
            continue;
          }
        } else {
          console.error("[ds-preview] " + card.id + " needs Babel but it is not loaded");
          continue;
        }
      }
      runCode(card, env, code, s.name);
    }
    var flush = env.pendingLoad.splice(0);
    if (flush.length) {
      setTimeout(function () {
        var ev; try { ev = new Event("load"); } catch (e) { ev = { type: "load" }; }
        flush.forEach(function (fn) {
          try { typeof fn === "function" && fn.call(env.win, ev); } catch (err) { console.error("[ds-preview]", err); }
        });
      }, 0);
    }
  }

  function bindInlineHandlers(card, env, rootEl) {
    var all = rootEl.querySelectorAll("*");
    for (var i = 0; i < all.length; i++) {
      var el = all[i];
      for (var j = 0; j < el.attributes.length; j++) {
        var at = el.attributes[j];
        if (at.name.indexOf("data-ds-on") !== 0) continue;
        (function (el, evt, code) {
          el.addEventListener(evt, function (event) {
            try {
              var fn = new Function("window", "document", "globalThis", "self", "__scope", "event", "with(__scope){\n" + code + "\n}");
              fn.call(el, env.win, env.doc, env.win, env.win, env.scope, event);
            } catch (err) { console.error("[ds-preview] inline handler:", err); }
          });
        })(el, at.name.slice(10), at.value);
      }
    }
  }

  function fit(section) {
    var card = cardById[section.id];
    var wrap = section.querySelector("[data-fit]");
    var stage = section.querySelector("[data-stage]");
    if (!card || !wrap || !stage) return;
    // Measure the available width on the SECTION, not the wrap: the wrap is
    // shrink-wrapped to the scaled stage below, so reading it back would feed
    // the previous scale into the next one.
    var cw = section.clientWidth || wrap.clientWidth;
    if (!cw) return;
    // The declared viewport height is a MINIMUM: content that ends up taller
    // (React mounts, fetched icons, wrapped rows) grows the stage instead of
    // getting clipped. Monotonic with a 1px tolerance so repeated measures
    // never jitter the layout back down.
    var rootEl = stage.shadowRoot && stage.shadowRoot.querySelector(".__dsroot");
    if (rootEl) {
      // Cap growth so content sized relative to the container (height:100%
      // plus a fixed extra) can never ratchet the stage upward forever.
      var contentH = Math.min(rootEl.scrollHeight, Math.max(card.h, 4000));
      if (contentH > (card.eh || card.h) + 1) card.eh = contentH;
    }
    var h = Math.max(card.eh || 0, card.h);
    stage.style.height = h + "px";
    // Width-only scaling: height never shrinks the card (it would leave blank
    // bands beside the narrower stage). The wrap shrink-wraps the scaled stage
    // so its frame always hugs the visible pixels.
    var scale = Math.min(cw / card.w, 1);
    stage.style.transform = scale === 1 ? "none" : "scale(" + scale + ")";
    wrap.style.width = Math.ceil(card.w * scale) + "px";
    wrap.style.height = Math.ceil(h * scale) + "px";
  }

  var sections = [].slice.call(document.querySelectorAll("[data-card]"));
  function fitAll() { sections.forEach(fit); }

  // ---- mount all cards
  sections.forEach(function (section) {
    var card = cardById[section.id];
    if (!card) return;
    var stage = section.querySelector("[data-stage]");
    try {
      var root = ensureShadow(stage);
      var rootEl = root.querySelector(".__dsroot");
      applyStyles(root, card.css);
      var env = makeEnv(card, root, rootEl);
      if (card.js.length) runScripts(card, env);
      bindInlineHandlers(card, env, rootEl);
      // Card content keeps changing after mount (React commits async, icon
      // fetches resolve, images decode) — re-measure on every DOM change and
      // resource load inside the shadow tree.
      if (window.MutationObserver) {
        new MutationObserver(function () { fit(section); }).observe(root, {
          childList: true,
          subtree: true,
          attributes: true,
          characterData: true,
        });
      }
      root.addEventListener("load", function () { fit(section); }, true);
    } catch (err) {
      console.error("[ds-preview] mount " + card.id + ":", err);
    }
    stage.setAttribute("data-ready", "1");
    fit(section);
  });

  // ---- scaling
  var scroller = document.querySelector("[data-scroll]");
  var inner = document.querySelector(".ds-content-inner");
  if (window.ResizeObserver && inner) {
    var raf = 0;
    new ResizeObserver(function () {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(fitAll);
    }).observe(inner);
  } else {
    window.addEventListener("resize", fitAll);
  }
  // Web fonts swap and late resources settle without DOM mutations —
  // re-measure once fonts are ready plus a few fallback ticks.
  if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
    document.fonts.ready.then(function () { fitAll(); });
  }
  [250, 750, 1500, 3000].forEach(function (ms) { setTimeout(fitAll, ms); });

  // ---- outline interactions
  var items = [].slice.call(document.querySelectorAll(".ds-item[data-target]"));
  var itemByTarget = {};
  items.forEach(function (it) { itemByTarget[it.getAttribute("data-target")] = it; });
  var anchors = [].slice.call(document.querySelectorAll("[data-anchor]"));
  var suppressUntil = 0;

  function setActive(it) {
    items.forEach(function (x) { x.classList.toggle("active", x === it); });
    if (it) {
      var g = it.closest(".ds-outline-group");
      if (g) g.classList.remove("collapsed");
    }
  }

  items.forEach(function (it) {
    it.addEventListener("click", function () {
      var target = document.getElementById(it.getAttribute("data-target"));
      if (!target || !scroller) return;
      var top = scroller.scrollTop + target.getBoundingClientRect().top - scroller.getBoundingClientRect().top - 20;
      suppressUntil = Date.now() + 900;
      setActive(it);
      scroller.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
    });
  });

  [].slice.call(document.querySelectorAll("[data-group-toggle]")).forEach(function (btn) {
    btn.addEventListener("click", function () {
      btn.closest(".ds-outline-group").classList.toggle("collapsed");
    });
  });

  function spy() {
    if (Date.now() < suppressUntil || !scroller) return;
    var cTop = scroller.getBoundingClientRect().top;
    var best = null;
    for (var i = 0; i < anchors.length; i++) {
      var r = anchors[i].getBoundingClientRect();
      if (r.top - cTop <= 90) best = anchors[i];
      else break;
    }
    if (!best && anchors.length) best = anchors[0];
    if (best) {
      var key = best.getAttribute("data-anchor-key") || best.id;
      setActive(itemByTarget[key] || itemByTarget[best.id] || null);
    }
  }
  if (scroller) {
    var sraf = 0;
    scroller.addEventListener("scroll", function () {
      cancelAnimationFrame(sraf);
      sraf = requestAnimationFrame(spy);
    }, { passive: true });
    spy();
  }

  // ---- readme collapse
  var readme = document.querySelector("[data-readme]");
  var toggle = document.querySelector("[data-readme-toggle]");
  if (readme && toggle) {
    var update = function () {
      var collapsed = readme.classList.contains("collapsed");
      toggle.textContent = collapsed ? "Show more" : "Show less";
    };
    if (readme.scrollHeight <= 300) {
      readme.classList.remove("collapsed");
      toggle.style.display = "none";
    }
    toggle.addEventListener("click", function () {
      readme.classList.toggle("collapsed");
      update();
      fitAll();
    });
    update();
  }

  window.addEventListener("load", fitAll);
})();

</script>
</body>
</html>
