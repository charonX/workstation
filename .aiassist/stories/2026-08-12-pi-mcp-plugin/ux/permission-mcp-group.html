<!-- @dsCard group="permission" name="permission-mcp-group" viewport="1080x760" -->
<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>权限配置 · MCP 规则族 — UX 原型</title>
<link rel="stylesheet" href="_ds/global/tokens.css">
<link rel="stylesheet" href="_ds/global/styles.css">
<style>
  body { background: var(--ch-bg); color: var(--ch-text); font-family: var(--ch-font-sans); }
  .stage { max-width: 1080px; margin: 24px auto; padding: 0 var(--ch-space-4); }
  .stage-note { font-size: var(--ch-text-xs); color: var(--ch-text-tertiary); margin-bottom: var(--ch-space-2); }

  .page { display: flex; flex-direction: column; gap: var(--ch-space-4); }
  .page-header { display: flex; align-items: center; gap: var(--ch-space-3); }
  .page-title { font-size: var(--ch-text-xl); font-weight: var(--ch-weight-semibold); margin: 0; flex: 1; }
  .scope-seg { display: inline-flex; border: 1px solid var(--ch-border); border-radius: var(--ch-radius-md); overflow: hidden; }
  .scope-seg button { padding: var(--ch-space-1) var(--ch-space-3); font-size: var(--ch-text-xs); background: var(--ch-surface); color: var(--ch-text-secondary); border: none; cursor: pointer; }
  .scope-seg button.active { background: var(--ch-accent-soft); color: var(--ch-accent-text); font-weight: var(--ch-weight-medium); }

  /* 族分组卡（对齐 permission-config 既有族形态） */
  .family { border: 1px solid var(--ch-border); border-radius: var(--ch-radius-xl); background: var(--ch-surface); overflow: hidden; }
  .family-head { display: flex; align-items: center; gap: var(--ch-space-3); padding: var(--ch-space-3) var(--ch-space-4); background: var(--ch-surface-high); border-bottom: 1px solid var(--ch-border); cursor: pointer; }
  .family-name { font-size: var(--ch-text-md); font-weight: var(--ch-weight-semibold); }
  .family-surface { font-family: var(--ch-font-mono); font-size: var(--ch-text-xs); color: var(--ch-text-tertiary); }
  .family-default { margin-left: auto; font-size: var(--ch-text-xs); color: var(--ch-text-secondary); }
  .family-default strong { color: var(--ch-warning); font-weight: var(--ch-weight-medium); }
  .family-caret { color: var(--ch-text-tertiary); font-size: var(--ch-text-xs); }

  .rules { display: none; }
  .family.open .rules { display: block; }
  .family.open .family-caret { transform: rotate(90deg); }

  table { width: 100%; border-collapse: collapse; font-size: var(--ch-text-sm); }
  th { text-align: left; font-size: var(--ch-text-xs); color: var(--ch-text-tertiary); font-weight: var(--ch-weight-medium); padding: var(--ch-space-2) var(--ch-space-4); border-bottom: 1px solid var(--ch-border); }
  td { padding: var(--ch-space-2) var(--ch-space-4); border-bottom: 1px solid var(--ch-border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .pattern { font-family: var(--ch-font-mono); font-size: var(--ch-text-sm); }

  /* allow/ask/deny 三态切换 */
  .verdict-seg { display: inline-flex; border: 1px solid var(--ch-border); border-radius: var(--ch-radius-md); overflow: hidden; }
  .verdict-seg button { padding: 3px var(--ch-space-3); font-size: var(--ch-text-xs); background: var(--ch-surface); color: var(--ch-text-secondary); border: none; cursor: pointer; }
  .verdict-seg button.active[data-v="allow"] { background: var(--ch-success-soft); color: var(--ch-success); font-weight: var(--ch-weight-medium); }
  .verdict-seg button.active[data-v="ask"] { background: var(--ch-warning-soft); color: var(--ch-warning); font-weight: var(--ch-weight-medium); }
  .verdict-seg button.active[data-v="deny"] { background: var(--ch-error-soft); color: var(--ch-error); font-weight: var(--ch-weight-medium); }

  /* 项目覆盖高亮 */
  .override-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ch-accent); margin-right: 6px; }
  .override-tag { font-size: 11px; color: var(--ch-accent-text); background: var(--ch-accent-soft); border-radius: var(--ch-radius-full); padding: 1px 8px; margin-left: 8px; }

  .add-row { padding: var(--ch-space-2) var(--ch-space-4); }
  .btn-tertiary { border: none; background: none; color: var(--ch-text-secondary); padding: var(--ch-space-1) var(--ch-space-2); font-size: var(--ch-text-xs); cursor: pointer; }
  .btn-tertiary:hover { color: var(--ch-accent-text); }
  .btn-tertiary.danger:hover { color: var(--ch-error); }

  /* 新规则内联表单 */
  .new-rule { display: none; padding: var(--ch-space-3) var(--ch-space-4); gap: var(--ch-space-2); align-items: center; border-top: 1px dashed var(--ch-border); }
  .new-rule.open { display: flex; }
  .new-rule input { flex: 1; padding: var(--ch-space-2) var(--ch-space-3); border: 1px solid var(--ch-border); border-radius: var(--ch-radius-md); font-size: var(--ch-text-sm); font-family: var(--ch-font-mono); background: var(--ch-surface); color: var(--ch-text); }
  .new-rule input:focus { outline: none; border-color: var(--ch-accent); }
  .hint { font-size: var(--ch-text-xs); color: var(--ch-text-tertiary); padding: 0 var(--ch-space-4) var(--ch-space-2); }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ch-surface-highest); border: 1px solid var(--ch-border); border-radius: var(--ch-radius-md); box-shadow: var(--ch-shadow-md); padding: var(--ch-space-2) var(--ch-space-4); font-size: var(--ch-text-sm); display: none; z-index: 90; }
  .toast.show { display: block; }
</style>
</head>
<body>
<div class="stage">
  <div class="stage-note">UX 原型 · 权限配置页新增 mcp 规则族（REQ-AGENT-087）· 交互：族展开/三态切换/新增规则/项目覆盖高亮 · 呈现对齐既有 bash/read 族</div>

  <div class="page" data-testid="permission-config-page">
    <div class="page-header">
      <h1 class="page-title">权限配置</h1>
      <div class="scope-seg">
        <button class="active">全局</button>
        <button>项目：charon/workstation</button>
      </div>
    </div>

    <!-- 既有族（折叠态，仅示意同构） -->
    <div class="family">
      <div class="family-head" onclick="this.parentElement.classList.toggle('open')">
        <span class="family-caret">▸</span>
        <span class="family-name">命令执行</span>
        <span class="family-surface">bash</span>
        <span class="family-default">未匹配默认 <strong>ask</strong></span>
      </div>
    </div>
    <div class="family">
      <div class="family-head" onclick="this.parentElement.classList.toggle('open')">
        <span class="family-caret">▸</span>
        <span class="family-name">文件读取</span>
        <span class="family-surface">read</span>
        <span class="family-default">未匹配默认 <strong>ask</strong></span>
      </div>
    </div>

    <!-- ============ ③ 新增：MCP 工具族 ============ -->
    <div class="family open" data-testid="perm-family-mcp">
      <div class="family-head" onclick="this.parentElement.classList.toggle('open')">
        <span class="family-caret">▸</span>
        <span class="family-name">MCP 工具</span>
        <span class="family-surface">mcp</span>
        <span class="family-default">规则 = <span class="pattern">server:tool</span> glob · 未匹配默认 <strong>ask</strong></span>
      </div>
      <div class="rules">
        <table>
          <thead><tr><th>规则（server:tool）</th><th>裁决</th><th></th></tr></thead>
          <tbody id="mcp-rules">
            <tr data-testid="perm-rule-row">
              <td><span class="override-dot" title="项目已覆盖"></span><span class="pattern">local-db:*</span><span class="override-tag">项目已改</span></td>
              <td>
                <div class="verdict-seg" data-testid="perm-rule-verdict">
                  <button data-v="allow" onclick="verdictPick(this)">allow</button>
                  <button class="active" data-v="ask" onclick="verdictPick(this)">ask</button>
                  <button data-v="deny" onclick="verdictPick(this)">deny</button>
                </div>
              </td>
              <td style="text-align:right"><button class="btn-tertiary danger" onclick="this.closest('tr').remove(); toast('已删除规则（演示）')">删除</button></td>
            </tr>
            <tr data-testid="perm-rule-row">
              <td><span class="pattern">github:create_issue</span></td>
              <td>
                <div class="verdict-seg" data-testid="perm-rule-verdict">
                  <button class="active" data-v="allow" onclick="verdictPick(this)">allow</button>
                  <button data-v="ask" onclick="verdictPick(this)">ask</button>
                  <button data-v="deny" onclick="verdictPick(this)">deny</button>
                </div>
              </td>
              <td style="text-align:right"><button class="btn-tertiary danger" onclick="this.closest('tr').remove(); toast('已删除规则（演示）')">删除</button></td>
            </tr>
            <tr data-testid="perm-rule-row">
              <td><span class="pattern">*:delete_*</span></td>
              <td>
                <div class="verdict-seg" data-testid="perm-rule-verdict">
                  <button data-v="allow" onclick="verdictPick(this)">allow</button>
                  <button data-v="ask" onclick="verdictPick(this)">ask</button>
                  <button class="active" data-v="deny" onclick="verdictPick(this)">deny</button>
                </div>
              </td>
              <td style="text-align:right"><button class="btn-tertiary danger" onclick="this.closest('tr').remove(); toast('已删除规则（演示）')">删除</button></td>
            </tr>
          </tbody>
        </table>
        <div class="new-rule" id="new-rule-form">
          <input data-testid="perm-rule-input" placeholder="server:tool，支持 * 通配，如 local-db:query_*">
          <div class="verdict-seg" id="new-rule-verdict">
            <button data-v="allow" onclick="verdictPick(this)">allow</button>
            <button class="active" data-v="ask" onclick="verdictPick(this)">ask</button>
            <button data-v="deny" onclick="verdictPick(this)">deny</button>
          </div>
          <button class="btn-tertiary" data-testid="perm-rule-add-submit" onclick="addRule()">添加</button>
          <button class="btn-tertiary" onclick="document.getElementById('new-rule-form').classList.remove('open')">取消</button>
        </div>
        <div class="add-row"><button class="btn-tertiary" data-testid="perm-rule-add" onclick="document.getElementById('new-rule-form').classList.add('open')">+ 添加规则</button></div>
        <div class="hint">规则表为单一真源（ADR-020），部署 JSON 由其生成；项目级覆盖在「项目」档位编辑并高亮。</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
  function verdictPick(btn){
    btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (!btn.closest('.new-rule')) toast('规则已更新（演示）');
  }
  function addRule(){
    const input = document.querySelector('[data-testid="perm-rule-input"]');
    const val = input.value.trim();
    if (!val.includes(':')) { input.style.borderColor = 'var(--ch-error)'; return; }
    const v = document.querySelector('#new-rule-verdict button.active').dataset.v;
    const tr = document.createElement('tr');
    tr.setAttribute('data-testid', 'perm-rule-row');
    tr.innerHTML = '<td><span class="pattern"></span></td><td><div class="verdict-seg" data-testid="perm-rule-verdict">'
      + ['allow','ask','deny'].map(x => '<button data-v="' + x + '"' + (x===v?' class="active"':'') + ' onclick="verdictPick(this)">' + x + '</button>').join('')
      + '</div></td><td style="text-align:right"><button class="btn-tertiary danger" onclick="this.closest(\'tr\').remove()">删除</button></td>';
    tr.querySelector('.pattern').textContent = val;
    document.getElementById('mcp-rules').appendChild(tr);
    input.value = ''; input.style.borderColor = '';
    document.getElementById('new-rule-form').classList.remove('open');
    toast('规则已添加：' + val + ' → ' + v);
  }
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }
</script>
</body>
</html>
