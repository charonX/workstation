intention: >-
  PI agent 能力受限：无法通过 MCP 调用外部工具（如 Linear/Notion/数据库/内部服务），
  也缺少应用内的 PI 插件安装/配置管理。一句话痛点：agent 能力受限，没有「安装 -> 配置 -> 使用」的扩展链路。

