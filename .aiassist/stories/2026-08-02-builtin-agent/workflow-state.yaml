story_id: 2026-08-02-builtin-agent
intention: >-
  平台的 AI 能力依赖本机 Claude Code 环境（新用户装完应用用不了）且只能手动搭 flow
  使用；人不在电脑前时无法了解平台正在进行的任务、无法下发任务——需要飞书对话驱动的
  内置 agent（零依赖内核 + 飞书入口，合并自 wayfind S1+S2）。

