story_id: 2026-09-06-cli-service-connection
intention: >-
  agent 运行时需要调用本机 CLI 服务来完成任务，但工作台目前只支持 MCP 连接，
  CLI 服务既不纳入管理，也不知道当前环境里装了哪些、可用性如何，
  agent 无法稳定使用。   # 一句话痛点,非方案。这是 story 的初衷,方案会变,痛点不会。

phase: REFLECT       # THINK / PRD / DESIGN / DOMAIN-MODEL / TECH-DESIGN(仅 complex；simple 直接结晶) / CRYSTALLIZE / TEST / ASSERTION-SIGNOFF / BUILD / QA / BUG / REFLECT
                  # 注：CRYSTALLIZE → TEST → ASSERTION-SIGNOFF 由 /story 自动链一次推进（仅升级点停下；单独调子 skill 也可推进）；其余阶段逐阶段路由。
attempt: 1        # 第几次尝试。归档重做时 +1。
bug-counter: 0    # story 内 bug 计数，/bug 每次修复 +1，用于 commit [bugfix] BUG-NNN。
