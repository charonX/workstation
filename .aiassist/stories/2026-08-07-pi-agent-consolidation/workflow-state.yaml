story_id: 2026-08-07-pi-agent-consolidation
intention: >-
  PI agent 集成是三次 story 叠加出来的，边角在累积：会话只建不收（无 idle 淘汰/无上限，
  内存随使用单调涨）、主进程日志无界泄漏、全空间混居单子进程（一崩全崩）、权限双层评估
  有规则级重复确认角落、worker/桥/策略文件职责交叠——需要一次整体的整理与优化，
  而不是继续贴补丁。

phase: THINK      # THINK / PRD / DESIGN / DOMAIN-MODEL / TECH-DESIGN / CRYSTALLIZE / TEST / ASSERTION-SIGNOFF / BUILD / QA / BUG / REFLECT
