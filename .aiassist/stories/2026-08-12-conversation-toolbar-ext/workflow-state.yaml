# Test-as-Contract workflow state
# 由 /story 创建和维护。本文件是状态机,不归档(回流时更新,不搬进 archive/)。

story_id: 2026-08-12-conversation-toolbar-ext
intention: >-
  对话区底部工具栏目前只有权限模式切换，未来需要扩展模型选择与附件添加——工具栏容器已预留槽位（toolbar-slot-model/attach），但尚无实际功能。   # 一句话痛点,非方案。这是 story 的初衷,方案会变,痛点不会。

phase: THINK      # THINK / PRD / DESIGN / DOMAIN-MODEL / TECH-DESIGN(仅 complex；simple 直接结晶) / CRYSTALLIZE / TEST / ASSERTION-SIGNOFF / BUILD / QA / BUG / REFLECT
attempt: 1        # 第几次尝试。归档重做时 +1。
bug-counter: 0    # story 内 bug 计数，/bug 每次修复 +1，用于 commit [bugfix] BUG-NNN。
created: 2026-08-12

# 阶段流转历史。正常前进和回流都记一条。
history:
  - {at: 2026-08-12, from: -, to: THINK, note: "创建 story"}

# 归档记录。每次"归档重做"追加一条;删 story 不记(整个目录删除)。
archive: []
#  - {attempt: 1, date: 2026-07-03, reason_file: archive/attempt-1/reason.md, root_layer: PRD}
#    root_layer 取值:THINK / PRD / DESIGN / DOMAIN-MODEL / TECH-DESIGN —— 表示这次回流判定根因活在哪一层。
#    TECH-DESIGN 语义 = 重做 prd.md §10 技术方案（仅 complex story）。

# 块状态(一挡内按块回流时维护)。
