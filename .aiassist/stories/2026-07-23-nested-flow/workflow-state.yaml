  - {at: 2026-07-23, from: THINK, to: PRD, note: "需求洞察完成（interview-notes.md）：核心='flow 作为节点'同步调用模型；子 flow 多 trigger/多入口共存、隔离 context、显式入出参映射、失败中止、8 层上限+静态循环检测、嵌套执行记录；本期做 callFlow 底层抽象，路由/扇出是上层节点的事。"}
  - {at: 2026-07-23, from: PRD, to: TECH-DESIGN, note: "PRD v0.1 用户审查通过。11 稳定块、complex 复杂度、11 错误码；初始决策方向：callFlow 内联递归、独立 execution 行带 parentExecutionId、引擎加 startNodeId。"}
  - {at: 2026-07-23, from: TECH-DESIGN, to: CRYSTALLIZE, note: "tech-design v0.1 完成：9 个关键决策（services 注入/内联递归/永远 draft/invokeSubflow 一站式/flowOutput 事后扫描/入参单引用保留类型/单 DFS 检测/独立 execution 行带 parentId/入口 override）；ADR-008 已登记；反向同步 PRD 子 flow 版本语义为'永远读当前版本（draft）'。"}
