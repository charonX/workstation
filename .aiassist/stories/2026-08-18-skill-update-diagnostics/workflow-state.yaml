story_id: 2026-08-18-skill-update-diagnostics
intention: >-
  技能源更新是黑盒：git 源更新失败原因不可见（无 log）、local 源不支持更新的原因
  无解释、技能组无版本号可辨新旧。用户点「更新」后无法判断更新是否发生/为何失败，
  更新体验与可诊断性缺失。   # 一句话痛点,非方案。这是 story 的初衷,方案会变,痛点不会。

phase: REFLECT     # THINK / PRD / DESIGN / DOMAIN-MODEL / TECH-DESIGN(仅 complex；simple 直接结晶) / CRYSTALLIZE / TEST / ASSERTION-SIGNOFF / BUILD / QA / BUG / REFLECT
attempt: 1        # 第几次尝试。归档重做时 +1。
bug-counter: 1    # story 内 bug 计数，/bug 每次修复 +1，用于 commit [bugfix] BUG-NNN。
created: 2026-08-18

